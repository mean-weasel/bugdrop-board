    proof_type: test
    completion_proof: 'Manual Install Smoke workflow exists, is contract-verified/documented, local smoke passes, PR/CI proves the change, and excluded scope remains untouched.'
    likely_misfire: 'Adding a workflow that only proves repo-local package state, or accidentally coupling smoke proof to publish/deploy/secrets.'
    blind_spots_considered:
      - 'A dry-run package workflow does not prove a published package can boot in a clean host app.'
      - 'Running install smoke by default on unreleased version-bump branches would create false failures.'
      - 'Workflow proof should be manual and version-pinned so it can verify current or historical published artifacts.'

