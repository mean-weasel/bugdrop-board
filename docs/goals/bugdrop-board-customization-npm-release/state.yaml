    task: T004
    commands:
      - 'gh workflow run "Package Widget" --ref main -f dry_run=true -f npm_tag=latest'
      - 'gh run watch 27069301552 --exit-status'
      - 'gh run view 27069301552 --json status,conclusion,url,headSha,displayTitle,event'
      - 'npm view @mean-weasel/bugdrop-board version dist-tags --json'
