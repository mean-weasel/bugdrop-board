      decision: approved
      full_outcome_complete: true
      summary: 'Conveyor Board 0 is complete: scaffold quality gates, CI, Worker health route, widget build rails, commit hooks, and forbidden-scope cleanup are all present and verified without later board behavior.'
      oracle_evidence:
