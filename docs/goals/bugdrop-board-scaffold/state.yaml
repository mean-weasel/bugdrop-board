        scope: 'Conveyor Board 1 should add D1 data model and host-signed auth; none of that was implemented in Board 0.'

  - id: T005
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: 'Remove Board 1 drift from Board 0 scaffold while preserving current rails and public/board.js generation.'
    allowed_files:
