      - 'Need Playwright dependency/config/scripts, dummy host app, browser E2E behavior, or test:e2e wiring.'
      - 'Need credentials, production Cloudflare resources, or a real D1 database.'
      - 'Scaffold requires D1 schema, auth, GitHub mirroring, items, upvotes, polling, or E2E host app behavior.'
      - 'Need versioned bundles such as public/board.v*.js or public/versions.json.'
      - 'Need knip ignoreDependencies broader than none, or at most esbuild if unavoidable.'
      - 'Verification fails twice for the same unresolved cause.'
      - 'The implementation would copy screenshot-specific BugDrop behavior.'
