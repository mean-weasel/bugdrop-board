      summary: 'Scaffolded Board 0 rails: package/tooling, Makefile, strict TS configs, ESLint/Prettier/Knip/audit gates, commit hooks, Node-24-ready CI, Wrangler config, minimal Hono /health route with Vitest coverage, and vanilla TypeScript widget build emitting public/board.js.'
