version: 2

goal:
  title: 'BugDrop Board Scaffold'
  slug: 'bugdrop-board-scaffold'
  kind: existing_plan
  tranche: 'Complete Conveyor Board 0: scaffold quality gates, CI, build/test/Worker/widget rails only, then stop after the scaffold oracle is proven.'
  status: complete
  oracle:
    signal: 'make check passes, npm run validate passes, npm run build:widget exits 0, public/board.js exists, starter CI/knip/commit-hook rules are present, and final audit confirms no BugDrop screenshot/annotation feedback code was copied.'
    cadence: 'after each Worker package and at final audit'
    final_proof: 'Receipt-backed command output for make check, npm run validate, and npm run build:widget; direct file inspection of public/board.js; direct inspection of CI/knip/commit-hook configs; and source scan/audit against screenshot-specific copied code.'
  intake:
    original_request: '$goal-prep Build Conveyor Board 0 from docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md, preserving the scaffold oracle and constraints.'
    interpreted_outcome: 'Prepare a GoalBuddy board that executes only the scaffold/build-rails tranche from the accepted implementation plan.'
    input_shape: existing_plan
    audience: 'BugDrop Board implementation workers and reviewers'
    authority: requested
    proof_type: test
    completion_proof: 'make check passes, npm run validate passes, npm run build:widget creates public/board.js, starter CI/knip/commit-hook configs exist, and final audit maps receipts to Conveyor Board 0 constraints.'
    likely_misfire: 'Copying BugDrop too literally and dragging screenshot, annotation, or feedback-category behavior into a scaffold-only tranche.'
    blind_spots_considered:
      - 'Board 0 should not implement D1 repositories, auth, GitHub issue creation, upvotes, polling, or E2E host app work.'
      - 'The scaffold should establish current Cloudflare/TypeScript build rails that later boards can extend.'
      - 'The Worker and widget should be intentionally minimal, so passing validation is not mistaken for product completion.'
    existing_plan_facts:
      - 'Input plan path: docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'Conveyor Board 0 goal oracle: make check passes, npm run validate passes, npm run build:widget creates public/board.js, and CI/knip/commit-hook rails exist.'
      - 'Likely misfire: copying screenshot-specific BugDrop code into the board repo.'
      - 'Worker stack: Cloudflare Worker using Hono.'
      - 'Widget stack: vanilla TypeScript bundled to public/board.js with esbuild.'
      - 'This tranche excludes D1 schema, host-signed auth, GitHub mirroring, upvotes, polling, comments, downvotes, GitHub Projects, and realtime.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-scaffold/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-scaffold'

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: 'Map the exact reusable scaffold inputs and forbidden BugDrop carryovers before any writes.'
    inputs:
      - 'docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'docs/superpowers/specs/2026-06-03-bugdrop-board-design.md'
      - 'AGENTS.md'
      - '/Users/neonwatty/Desktop/bugdrop/package.json'
      - '/Users/neonwatty/Desktop/bugdrop/Makefile'
      - '/Users/neonwatty/Desktop/bugdrop/tsconfig.json'
      - '/Users/neonwatty/Desktop/bugdrop/tsconfig.widget.json'
      - '/Users/neonwatty/Desktop/bugdrop/eslint.config.js'
      - '/Users/neonwatty/Desktop/bugdrop/.prettierrc'
      - '/Users/neonwatty/Desktop/bugdrop/commitlint.config.cjs'
      - '/Users/neonwatty/Desktop/bugdrop/knip.json'
      - '/Users/neonwatty/Desktop/bugdrop/wrangler.toml'
      - '/Users/neonwatty/Desktop/bugdrop/scripts/build-widget.js'
      - '/Users/neonwatty/Desktop/bugdrop/.github/workflows/ci.yml'
      - '/Users/neonwatty/Desktop/bugdrop/.husky/pre-commit'
      - '/Users/neonwatty/Desktop/bugdrop/.husky/commit-msg'
    constraints:
      - 'Read-only.'
      - 'Do not edit implementation files.'
      - 'Identify only scaffold/build-rails facts for Conveyor Board 0.'
      - 'Explicitly list BugDrop screenshot, annotation, picker, and feedback-category files or concepts that must not be copied.'
      - 'Prefer concrete file-path evidence over generic advice.'
    expected_output:
      - 'Reusable scaffold and CI/quality-gate facts from the implementation plan and BugDrop reference.'
      - 'Forbidden carryover list for screenshot/annotation feedback behavior.'
      - 'Exact candidate Worker package for scaffold/build rails.'
      - 'Verification commands and final oracle evidence, including make check and CI config inspection.'
    receipt:
      result: done
      summary: 'Mapped Board 0 scaffold inputs and forbidden BugDrop carryovers. Board 0 should establish package/tooling/CI/quality gates, a minimal Hono health route, and a vanilla TypeScript widget bundle to public/board.js only.'
      evidence:
        - 'state.yaml limits this tranche to scaffold quality gates, CI, build/test/Worker/widget rails.'
        - 'state.yaml requires make check, npm run validate, npm run build:widget, public/board.js, and CI/knip/commit-hook rails.'
        - 'Implementation plan defines Conveyor Board 0 oracle and Worker scope.'
        - 'BugDrop package/config files provide reusable strict TS, ESLint, Prettier, commitlint, husky, lint-staged, knip, audit, Actions guard, Vitest, Wrangler, Hono, and esbuild patterns.'
        - 'Targeted BugDrop scan found forbidden screenshot/annotation/picker/mask/capture files and concepts that must not be copied.'
      facts:
        - 'Candidate Worker package is T003 allowed_files plus verification commands as already listed in this board.'
        - 'Minimal Worker behavior should be only Hono app health route plus focused route test.'
        - 'Widget build should emit public/board.js and not public/widget.js.'
        - 'Verification should include npm install, make check, npm run validate, npm run build:widget, test -s public/board.js, CI/knip/hook file inspection, Actions guard, and forbidden source scan.'
      contradictions:
        - 'The full implementation plan includes later D1/auth/GitHub/widget-host work, but this board explicitly excludes those from Conveyor Board 0.'
        - 'BugDrop reference includes html-to-image, screenshot benchmark scripts, MAX_SCREENSHOT_SIZE_MB, RATE_LIMIT KV, preview deploy/live E2E, and screenshot hooks; those are forbidden or premature here.'
        - 'BugDrop ESLint ignores large screenshot-specific widget files; Board 0 should avoid inheriting ignores that mask copied complexity.'
      ambiguity_requiring_judge:
        - 'Whether to include Playwright dependency/config in Board 0 when the oracle does not require E2E.'
        - 'Whether versioned board.v*.js and versions.json are required in Board 0 or a single public/board.js is enough.'
        - 'Whether knip should ignore only esbuild or any future release/deploy-only package.'
      commands:
        - 'sed/rg inspections of goal.md, state.yaml, implementation plan, design spec, AGENTS.md, and BugDrop reference configs.'

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: medium
    objective: 'Review Scout findings and authorize the largest safe scaffold and CI/quality-rails Worker package.'
    inputs:
      - 'T001 receipt'
      - 'Goal oracle'
      - 'AGENTS.md proof expectations'
    constraints:
      - 'Do not implement.'
      - 'Keep the package to Conveyor Board 0 only.'
      - 'Reject any plan that includes D1 schema, auth, GitHub issue mirroring, board items, upvotes, polling, or E2E host app behavior.'
      - 'Pick one coherent Worker slice with allowed_files, verify commands, and stop_if conditions.'
    expected_output:
      - 'Decision: proceed | revise | blocked'
      - 'Exact Worker objective'
      - 'allowed_files'
      - 'verify commands'
      - 'stop_if conditions'
      - 'Deferred tasks for later conveyor boards'
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      summary: 'Proceed with one Board 0 Worker slice, revised to exclude Playwright, D1 harness/schema, versioned bundles, and broad knip ignores. The safe slice is scaffold/tooling/CI plus minimal Hono health route and a single widget bundle at public/board.js.'
      evidence:
        - 'T001 receipt identifies Board 0 as scaffold rails only with public/board.js and no screenshot carryover.'
        - 'goal.md excludes D1 schema, auth, GitHub mirroring, items, upvotes, polling, and E2E host app work.'
        - 'Implementation plan Board 0 oracle requires make check, npm run validate, npm run build:widget, public/board.js, and starter CI rails.'
        - 'AGENTS.md requires proof by exact commands/config inspection.'
      ambiguity_resolutions:
        playwright: 'Defer; do not add @playwright/test, Playwright config, E2E scripts, or dummy host app in Board 0.'
        bundle_versioning: 'Use single public/board.js only; defer board.v*.js and versions.json.'
        knip_ignore_scope: 'Prefer no ignored dependencies by importing esbuild from the build script; ignore only esbuild if unavoidable.'
      worker_package:
        objective: 'Scaffold Conveyor Board 0 only: package/tooling, strict TypeScript, lint/format/knip/audit/test gates, commit hooks, Node-24-ready CI, Wrangler Worker config, a minimal Hono /health route with Vitest coverage, and a vanilla TypeScript widget build that emits exactly public/board.js.'
        allowed_files:
          - 'package.json'
          - 'package-lock.json'
          - 'Makefile'
          - 'tsconfig.json'
          - 'tsconfig.widget.json'
          - 'eslint.config.js'
          - '.prettierrc'
          - 'commitlint.config.cjs'
          - 'knip.json'
          - '.husky/pre-commit'
          - '.husky/commit-msg'
          - '.github/workflows/ci.yml'
          - 'vitest.config.ts'
          - 'wrangler.toml'
          - 'scripts/build-widget.js'
          - 'src/index.ts'
          - 'src/types.ts'
          - 'src/routes/api.ts'
          - 'src/widget/index.ts'
          - 'src/widget/types.ts'
          - 'test/routes.test.ts'
          - '.gitignore'
          - 'public/board.js'
        verify_commands:
          - 'npm install'
          - 'make check'
          - 'npm run validate'
          - 'npm run build:widget'
          - 'test -s public/board.js'
          - 'npm run check:actions-node24'
          - 'test -f .github/workflows/ci.yml && test -f knip.json && test -f commitlint.config.cjs && test -f .husky/pre-commit && test -f .husky/commit-msg'
          - 'rg -n "screenshot|annotation|annotator|picker|feedback category|html-to-image|data-bugdrop-mask|D1|migration|board_items|upvote|polling|GitHub Issue|playwright" src scripts test package.json wrangler.toml .github/workflows/ci.yml knip.json || true'

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: 'Scaffold Conveyor Board 0 only: package/tooling, strict TypeScript, lint/format/knip/audit/test gates, commit hooks, Node-24-ready CI, Wrangler Worker config, a minimal Hono /health route with Vitest coverage, and a vanilla TypeScript widget build that emits exactly public/board.js.'
    allowed_files:
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - 'tsconfig.json'
      - 'tsconfig.widget.json'
      - 'eslint.config.js'
      - '.prettierrc'
      - 'commitlint.config.cjs'
      - 'knip.json'
      - '.husky/pre-commit'
      - '.husky/commit-msg'
      - '.github/workflows/ci.yml'
      - 'vitest.config.ts'
      - 'wrangler.toml'
      - 'scripts/build-widget.js'
      - 'src/index.ts'
      - 'src/types.ts'
      - 'src/routes/api.ts'
      - 'src/widget/index.ts'
      - 'src/widget/types.ts'
      - 'test/routes.test.ts'
      - '.gitignore'
