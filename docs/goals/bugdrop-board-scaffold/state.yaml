        validate: 'Passed after cleanup; Vitest reported 1 test file passed and 1 test passed.'
        build_widget: 'Passed after cleanup; generated public/board.js.'
        widget_artifact: 'Direct inspection showed public/board.js is 505 bytes and contains only the minimal bootstrap IIFE mounting data-bugdrop-board-root text.'
        quality_rails: '.github/workflows/ci.yml, knip.json, commitlint.config.cjs, .husky/pre-commit, and .husky/commit-msg are present; package scripts include lint, format:check, typecheck, knip, audit, Actions guard, validate, and build:widget.'
        no_forbidden_carryover: 'rg scan across .gitignore, src, scripts, test, package.json, wrangler.toml, CI, knip, and public/board.js returned no matches for screenshot/annotation/picker/html-to-image/D1/upvote/polling/GitHub Issue/Playwright/versioned-bundle drift.'
        final_ci: 'make ci passed, including check, unit tests, widget build, and TypeScript build.'
      deferred_next_board:
