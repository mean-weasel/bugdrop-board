      - 'Recommended API contract for GET board items, POST upvote toggle, and GET events with since cursor.'
      - 'Recommended auth and cross-board isolation checks using Board 1 tokens.'
      - 'Recommended test matrix proving two-viewer behavior, viewerHasUpvoted state, upvote count, ordered cursor events, and invalid/wrong-scope rejection.'
      - 'Exact candidate Worker package with allowed_files, verify commands, and stop_if conditions.'
      - 'Forbidden carryover list for widget/host-app/E2E/realtime/GitHub drift.'
    receipt:
      result: done
      summary: 'Mapped the Board 3 API gap. Board 1/2 foundations are present: host-signed tokens, D1 board/items/votes/events schema, repository primitives, and create-item GitHub mirror route. Board 3 needs only signed board item reads, signed upvote toggle route, and signed event cursor route.'
      evidence:
        - 'src/routes/api.ts exposes GET /health and POST /boards/:boardId/items only; no board item read, upvote toggle, or events cursor routes exist yet.'
        - 'src/lib/board-repository.ts already has listItems(boardId), toggleUpvote(boardId, itemId, externalUserId), and listEvents(boardId, since).'
        - 'toggleUpvote is board-scoped, uses externalUserId, updates upvote_count, and appends upvote_added/upvote_removed events.'
        - 'listEvents is board-scoped and ordered by id ASC with id > since and LIMIT 100.'
        - 'migrations/0001_initial.sql has board_votes UNIQUE(board_id, item_id, external_user_id), board_events id INTEGER PRIMARY KEY AUTOINCREMENT, and idx_board_events_board_id(board_id, id).'
        - 'Board 2 route verifies board tokens using BOARD_TOKEN_SECRET plus audience/issuer and persists created user identity from token claims, not request bodies.'
      required_worker_shape:
        - 'Add listItemsForViewer(boardId, externalUserId) or equivalent to return current items with viewerHasUpvoted while preserving status, issue metadata, counts, creator, and timestamps.'
        - 'Add GET /boards/:boardId/items requiring a valid board-scoped Bearer token, returning { items }.'
        - 'Add POST /boards/:boardId/items/:itemId/upvote requiring a valid board-scoped Bearer token, using verified claims.externalUserId, returning { item }.'
        - 'Add GET /boards/:boardId/events?since=<cursor> requiring a valid board-scoped Bearer token, validating since as a nonnegative integer, and returning { cursor, events }.'
      verifier_warning:
        - 'The prepared whole-tree forbidden scan included createGitHubIssue and GITHUB_ISSUE_ACCESS_TOKEN, but those symbols are valid completed Board 2 code. Board 3 verification must use a diff-scoped GitHub-drift check or remove those terms from whole-tree scans.'

