version: 2

goal:
  title: 'BugDrop Board Votes And Polling'
  slug: 'bugdrop-board-votes-polling'
  kind: existing_plan
  tranche: 'Complete Conveyor Board 3: voting, board read, and polling/event read APIs only.'
  status: done
  oracle:
    signal: 'Two simulated authenticated viewers can load board items, toggle an upvote, observe acting-user viewerHasUpvoted/upvoteCount immediately, and poll ordered event deltas after a cursor; cross-board reads/writes stay isolated; make check and npm run validate pass; final audit confirms no widget/host-app/E2E/realtime/GitHub-mirroring drift.'
    cadence: 'after each Worker package and at final audit'
    final_proof: 'Receipt-backed command output for route tests covering board read, upvote toggle, event cursor polling, cross-board isolation, make check, and npm run validate; direct inspection of signed-token identity use and repository/event ordering; and source scan/audit against widget UI, dummy host app, Playwright/E2E, realtime, comments, downvotes, GitHub Projects, screenshot, annotation, and new GitHub mirroring behavior.'
  intake:
    original_request: '$goal-prep Build Conveyor Board 3 from docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md: voting and polling/event read APIs only, using the completed Board 1 D1/auth foundation and Board 2 create-item GitHub mirror foundation.'
    interpreted_outcome: 'Prepare a GoalBuddy board that executes only the Board 3 backend read/upvote/polling API tranche from the accepted implementation plan.'
    input_shape: existing_plan
    audience: 'BugDrop Board implementation workers and reviewers'
    authority: requested
    proof_type: test
    completion_proof: 'Authenticated route tests prove current board item reads, one-user upvote toggle behavior, viewer-specific upvote state, ordered event polling after a cursor, cross-board isolation, and no later-board scope drift; make check and npm run validate pass.'
    likely_misfire: 'Returning stale counters, trusting browser-provided user ids, leaking cross-board items/events, skipping events when multiple writes happen quickly, adding widget/E2E/realtime work, or modifying GitHub mirror behavior instead of preserving it.'
    blind_spots_considered:
      - 'Board 1 already created D1 tables, repository primitives, host-signed token helpers, and upvote/event repository behavior; Scout must verify exact current API gaps before Worker edits.'
      - 'Board 2 already created the item creation route and GitHub issue metadata persistence; Board 3 should read that metadata but not create or modify GitHub Issues.'
      - 'Viewer-specific upvote state may require a repository read helper or route-level vote lookup; Judge should pick the smallest coherent package.'
      - 'Polling means cursor-based event reads only for this board, not realtime transport.'
    existing_plan_facts:
      - 'Input plan path: docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'Conveyor Board 3 goal oracle from the plan: two simulated viewers can load a board, one viewer creates/upvotes an item, and the other viewer receives the changed item via cursor polling.'
      - 'Relevant implementation plan slice: Task 7 Upvote and Polling API.'
      - 'Completed foundation: Board 1 D1/auth repository/token foundation.'
      - 'Completed foundation: Board 2 create-item route and GitHub Issue metadata mirror.'
      - 'This tranche excludes widget UI/API client, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, realtime/WebSocket/Durable Object transport, screenshot capture, annotation, html-to-image, and new GitHub mirroring behavior.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-votes-polling/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-votes-polling'

active_task: null

tasks:
