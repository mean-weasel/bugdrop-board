version: 2

goal:
  title: 'BugDrop Board Closed Beta Security And Abuse Hardening'
  slug: 'bugdrop-board-closed-beta-security-abuse'
  kind: existing_plan
  tranche: 'Closed-beta security and abuse hardening only.'
  status: done
  oracle:
    signal: 'Closed-beta board APIs have bounded read/event misuse controls, bounded token lifetime policy, event payload privacy, and CORS negative smoke proof.'
    cadence: 'after each Worker tranche and final Judge audit'
    final_proof: 'Focused security tests, deploy-smoke helper tests, docs diff inspection, standard repo gates, and forbidden-scope scan.'
  intake:
    original_request: 'Build BugDrop Board Closed Beta Board 2: security and abuse hardening only.'
    interpreted_outcome: 'Prepare the second closed-beta conveyor board to add concrete misuse controls and proof after Board 1 setup safety.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers and closed-beta self-host operators'
    authority: requested
    proof_type: test
    completion_proof: 'Security/abuse oracle is satisfied with passing focused tests, docs, and no excluded release/deploy/credential work.'
    likely_misfire: 'Expanding into setup docs, status workflow, hosted control plane, monitoring, deploys, or broad product changes instead of bounded abuse-hardening proof.'
    blind_spots_considered:
      - 'Authenticated reads/events may be unthrottled even if writes are rate-limited.'
      - 'Token `exp` may accept overly long-lived tokens unless a max TTL exists.'
      - 'Polling event payloads may expose stable host user ids to other viewers.'
      - 'CORS smoke may prove only allowed origins and miss disallowed-origin regressions.'
      - 'Docs alone are weak proof when a realistic misuse case can be tested.'
    hard_constraints:
      - 'Preserve current product shape.'
      - 'Exclude setup docs already handled in Board 1.'
      - 'No status workflow.'
      - 'No hosted control plane, billing, realtime, comments, downvotes, or GitHub Projects.'
      - 'No npm publishing, Cloudflare deploys, credential changes, secret rotation, or secret file edits.'
      - 'No ops monitoring, incident response, backup/export/restore implementation.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: active
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-closed-beta-security-abuse/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-closed-beta-security-abuse'

active_task: null

