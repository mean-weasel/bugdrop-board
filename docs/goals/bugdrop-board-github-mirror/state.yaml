version: 2

goal:
  title: 'BugDrop Board GitHub Mirror'
  slug: 'bugdrop-board-github-mirror'
  kind: existing_plan
  tranche: 'Complete Conveyor Board 2: validation, GitHub Issue client/interface, and create-item GitHub mirror flow only.'
  status: complete
  oracle:
    signal: 'Creating an item with a valid token persists a D1 item, creates one mocked GitHub Issue payload, stores the issue number/URL, appends an event, fails atomically when GitHub creation fails, make check passes, npm run validate passes, and final audit confirms no widget/polling/host-app/E2E/realtime drift.'
    cadence: 'after each Worker package and at final audit'
    final_proof: 'Receipt-backed command output for GitHub client tests, create-item route tests, GitHub failure atomicity tests, make check, and npm run validate; direct inspection of route/client injection and issue metadata persistence; and source scan/audit against widget UI, polling, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, realtime, screenshot, and annotation behavior.'
  intake:
    original_request: '$goal-prep Build Conveyor Board 2 from docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md: validation/GitHub client and real GitHub Issue mirroring only, using the completed Board 1 D1/auth foundation and excluding widget UI, polling, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, and realtime.'
    interpreted_outcome: 'Prepare a GoalBuddy board that executes only the create-item/GitHub mirror tranche from the accepted implementation plan.'
    input_shape: existing_plan
    audience: 'BugDrop Board implementation workers and reviewers'
    authority: requested
    proof_type: test
    completion_proof: 'Valid token create flow validates input, creates exactly one mocked GitHub Issue, persists D1 item with issue metadata, appends event, rejects invalid token/input, fails without orphaned D1 item on GitHub failure, and passes make check and npm run validate.'
    likely_misfire: 'Creating D1 items without GitHub Issues, using fake issue metadata, treating GITHUB_PRIVATE_KEY as an installation token, trusting unsigned browser user ids, or drifting into widget/polling/E2E work.'
    blind_spots_considered:
      - 'Board 1 left GitHub issue fields nullable; Board 2 should populate them through the create-item mirror path.'
      - 'Production GitHub App installation-token generation may need Scout/Judge scoping before Worker code; tests should use injected issue creation or mocked fetch to avoid real credentials.'
      - 'Atomicity matters: if GitHub issue creation fails, the D1 item should not remain as an orphaned board item.'
      - 'Polling/event cursor API is later Board 3 even though Board 2 appends events.'
    existing_plan_facts:
      - 'Input plan path: docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'Conveyor Board 2 goal oracle: creating an item with a valid token persists a D1 item, creates one mocked GitHub Issue payload, stores issue URL, appends an event, and fails atomically when GitHub creation fails.'
      - 'Relevant implementation plan slices: Task 5 Validation and GitHub Issue Client; Task 6 Create Item API Route.'
      - 'Board 1 D1/auth foundation is complete and should be reused.'
      - 'This tranche excludes widget UI, polling API, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, and realtime.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-github-mirror/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-github-mirror'

