version: 2

goal:
  title: 'BugDrop Board Package Files Hygiene'
  slug: 'bugdrop-board-package-files-hygiene'
  kind: existing_plan
  tranche: 'Package metadata hygiene after deploy-smoke automation.'
  status: done
  oracle:
    signal: 'The future npm tarball includes all script files referenced by package.json commands.'
    cadence: 'after Worker edit and final audit'
    final_proof: 'npm pack dry-run output includes scripts/verify-deployed-worker.js and scripts/verify-package-install.js, plus validation gates.'
  intake:
    original_request: 'Continue the BugDrop Board release-readiness conveyor while the user is away.'
    interpreted_outcome: 'Close the package-files gap introduced by the deploy-smoke command before any future npm publish.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers publishing future package versions'
    authority: approved_for_safe_local_and_pr_work
    proof_type: artifact
    completion_proof: 'Package dry-run proves both verifier scripts are included.'
    likely_misfire: 'Publishing a new version or changing runtime behavior instead of correcting package metadata.'
    blind_spots_considered:
      - 'package.json scripts are visible in the tarball, so referenced script files should either be included or not referenced.'
      - 'The previous release-smoke tranche already included verify-package-install.js; deploy smoke needs the same treatment.'

