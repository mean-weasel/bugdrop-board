version: 2

goal:
  title: 'BugDrop Board Closed Beta Setup Safety'
  slug: 'bugdrop-board-closed-beta-setup-safety'
  kind: existing_plan
  tranche: 'Closed-beta setup safety and installer trust only.'
  status: done
  oracle:
    signal: 'A fresh closed-beta self-host installer can follow docs/scripts/workflow defaults without stale package references, ambiguous token scopes, or accidental development deploy configuration.'
    cadence: 'after each Worker tranche and final Judge audit'
    final_proof: 'Docs/workflow/script diff inspection, current package/version proof, focused drift scans, standard verification gates, and explicit forbidden-scope scan.'
  intake:
    original_request: 'Build BugDrop Board Closed Beta Board 1: setup safety and installer trust only.'
    interpreted_outcome: 'Prepare the first closed-beta conveyor board to make setup and deploy guidance trustworthy before broader beta security, UX, CI, or ops work.'
    input_shape: existing_plan
    audience: 'Closed-beta self-host installers and BugDrop Board maintainers'
    authority: requested
    proof_type: artifact
    completion_proof: 'Goal oracle is satisfied with passing verification and no excluded runtime, deploy, credential, or publish work.'
    likely_misfire: 'Turning setup-safety prep into product feature work, security hardening, monitoring, or a release/publish/deploy operation.'
    blind_spots_considered:
      - 'Plain deploy scripts may target top-level development Wrangler config instead of production env.'
      - 'README and install-smoke defaults may still reference old package versions.'
      - 'Host token setup can be technically correct but not copy-pasteable for beta installers.'
      - 'GitHub token guidance can remain too vague, leading to over-scoped or wrong-repo tokens.'
      - 'Closed-beta readiness can be claimed without an installer-facing checklist and focused drift scan.'
    hard_constraints:
      - 'Preserve current product behavior.'
      - 'No status workflow.'
      - 'No new security throttles or abuse-control behavior.'
      - 'No ops monitoring or backup/export implementation.'
      - 'No hosted control plane, billing, realtime, comments, downvotes, or GitHub Projects.'
      - 'No npm publishing, package version bump, Cloudflare deploy, credential changes, or secret edits.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: active
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-closed-beta-setup-safety/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-closed-beta-setup-safety'

active_task: null

