      - 'package.json'
      - 'Makefile'
      - '.github/workflows/install-smoke.yml'
      - '.github/workflows/deploy.yml'
      - 'wrangler.toml'
      - '.dev.vars.example'
      - 'docs/staging-dogfood.md'
      - 'docs/production-dogfood.md'
      - 'docs/release-readiness-results/'
      - 'docs/goals/bugdrop-board-closed-beta-setup-safety/notes/T001-setup-scout.md'
      - 'docs/goals/bugdrop-board-closed-beta-setup-safety/state.yaml'
    expected_output: 'A compact evidence note listing stale version/package claims, deploy-env footguns, missing host-token examples, GitHub token ambiguities, and the smallest safe edit plan.'
    verify:
