    receipt:
      result: done
      summary: 'Mapped concrete setup-safety drift: stale install-smoke/default handoff references, production docs that can fall through to top-level development Wrangler config, missing copy-paste host-token endpoint examples, and GitHub token scope ambiguity.'
      evidence:
        - '`npm view @mean-weasel/bugdrop-board version dist-tags --json` reports version/latest `0.2.0`.'
        - '`.github/workflows/install-smoke.yml` still defaults `package_version` to `0.1.2`.'
        - '`README.md` handoff notes still describe `0.1.2` as latest and `0.2.0` as pending.'
        - '`README.md` production deploy examples omit explicit `--env production` despite top-level development Wrangler config and placeholder D1 ids.'
        - '`src/widget/index.ts` fetches the token endpoint with browser credentials, but README does not call out the cookie/CORS implication.'
        - '`docs/staging-dogfood.md` has clearer fine-grained issue-token guidance than the README setup path.'
      note: 'docs/goals/bugdrop-board-closed-beta-setup-safety/notes/T001-setup-scout.md'

