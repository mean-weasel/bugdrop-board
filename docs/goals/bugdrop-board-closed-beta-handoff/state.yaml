          status: pass
          evidence: 'GoalBuddy state checker passed before final closeout.'
        - command: 'rg -n "Evidence To Capture|Evidence:|Readiness Matrix|Beta Blockers|Accepted Closed-Beta Limitations|Deferred Product Work|Operator-Owned Actions|Go Criteria|No-Go Criteria|Conditional Go|Closed Beta Handoff|Risk Review" docs/closed-beta-runbook.md docs/closed-beta-dogfood-script.md docs/closed-beta-readiness.md docs/closed-beta-risks.md'
