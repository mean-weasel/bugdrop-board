      - 'npx prettier --check docs/goals/bugdrop-board-closed-beta-handoff/goal.md docs/goals/bugdrop-board-closed-beta-handoff/state.yaml docs/goals/bugdrop-board-closed-beta-handoff/notes/*.md'
