          evidence: 'Command passed; verifier received explicit --url/--expect-environment and returned production health ok plus HEAD /board.js 200 text/javascript.'
        - command: 'DEPLOY_SMOKE_URL=https://board.bugdrop.dev DEPLOY_SMOKE_EXPECT_ENVIRONMENT=production make deploy-smoke'
          status: pass
