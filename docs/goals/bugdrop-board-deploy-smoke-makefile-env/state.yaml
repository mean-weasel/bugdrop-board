version: 2

goal:
  title: 'BugDrop Board Deploy Smoke Makefile Env'
  slug: 'bugdrop-board-deploy-smoke-makefile-env'
  kind: existing_plan
  tranche: 'Post-v0.1.0 deploy smoke helper ergonomics.'
  status: done
  oracle:
    signal: 'The Makefile deploy smoke helper supports both Makefile variables and DEPLOY_SMOKE_* environment variables.'
    cadence: 'after Makefile/docs edit and final audit'
    final_proof: 'Both supported Makefile invocation forms pass against https://board.bugdrop.dev, and standard repo checks pass.'
  intake:
    original_request: 'Continue the BugDrop Board release-readiness conveyor while the user is away.'
    interpreted_outcome: 'Remove a small self-host verification footgun from make deploy-smoke without changing runtime behavior.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers and self-hosters verifying Worker deployments'
    authority: approved_for_safe_local_and_pr_work
    proof_type: artifact
    completion_proof: 'Makefile deploy smoke commands prove the documented invocation styles.'
    likely_misfire: 'Adding product behavior or touching deployment credentials instead of tightening the helper command.'
    blind_spots_considered:
      - 'The verifier script already supports DEPLOY_SMOKE_URL, but the Makefile always passed an empty --url when URL was omitted.'
      - 'Self-hosters may naturally export DEPLOY_SMOKE_* values in CI or local shells.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-deploy-smoke-makefile-env/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-deploy-smoke-makefile-env'

active_task: null

