      - 'env -u DEPLOY_SMOKE_URL -u DEPLOY_SMOKE_EXPECT_ENVIRONMENT make deploy-smoke'
      - 'npm run validate'
      - 'make check'
      - 'node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.8/skills/goalbuddy/scripts/check-goal-state.mjs docs/goals/bugdrop-board-deploy-smoke-makefile-env/state.yaml'
