      rationale:
        - 'Splitting D1 and token work would add coordination without materially reducing risk.'
        - 'GitHub issue fields must stay nullable in Board 1; fake issue numbers/URLs would create false proof and drift into Board 2 mirroring semantics.'
      worker_package:
        objective: 'Implement the Board 1 local D1 harness, migration/schema, board repository behavior, and host-signed token verification helpers/tests, without GitHub mirroring, API routes, widget UI, polling, Playwright/E2E, comments, downvotes, GitHub Projects, realtime, or dummy host app work.'
        allowed_files:
