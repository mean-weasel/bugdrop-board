          - 'package-lock.json'
          - 'vitest.config.ts'
          - 'wrangler.toml'
          - 'migrations/0001_initial.sql'
          - 'src/types.ts'
          - 'src/lib/ids.ts'
          - 'src/lib/board-repository.ts'
          - 'src/lib/board-token.ts'
          - 'test/apply-migrations.ts'
          - 'test/board-repository.test.ts'
          - 'test/board-token.test.ts'
        schema_decision: 'board_items.github_issue_number and board_items.github_issue_url are nullable for Board 1 tests; Board 2 can tighten mirror invariants when real GitHub issue creation exists.'
        verify:
          - 'npm install'
          - 'npm run test -- test/board-repository.test.ts'
          - 'npm run test -- test/board-token.test.ts'
          - 'npm run validate'
          - 'make check'
          - 'direct migration inspection for primary keys, foreign keys, status/upvote CHECK constraints, nullable github_issue_number/github_issue_url, and UNIQUE(board_id, item_id, external_user_id)'
          - 'rg --hidden forbidden-scope audit for GitHub mirroring, item routes, widget UI, polling, Playwright, comments, downvotes, GitHub Projects, WebSocket, screenshot, annotation, and html-to-image.'
        stop_if:
          - 'Need files outside allowed_files.'
          - 'Need GitHub issue client, validation/GitHub clients, item API routes, widget UI, polling API, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, or realtime behavior.'
          - 'Need production Cloudflare credentials or a remote D1 database.'
          - 'D1 local harness cannot be made reliable without changing the Board 1 scope.'
          - 'Token verification would trust an unsigned browser-provided user id.'
          - 'Migration requires NOT NULL GitHub issue number/url or placeholder GitHub issue data for Board 1 item creation tests.'
          - 'Verification fails twice for the same unresolved cause.'
          - 'The implementation would copy screenshot-specific BugDrop behavior.'
      deferred_tasks:
        - 'Board 2: validation/GitHub client and real GitHub Issue mirroring.'
        - 'Later board: item API routes and request validation boundaries.'
        - 'Later board: widget UI, polling/event API, dummy host app, and Playwright/E2E.'
        - 'Out of scope unless a newer spec says otherwise: comments, downvotes, GitHub Projects, and realtime/WebSocket behavior.'

