version: 2

goal:
  title: 'BugDrop Board Data And Auth'
  slug: 'bugdrop-board-data-auth'
  kind: existing_plan
  tranche: 'Complete Conveyor Board 1: D1 data model, repository tests, local D1 harness, and host-signed token verification only.'
  status: complete
  oracle:
    signal: 'D1 migrations apply locally, auth negative tests reject missing/expired/wrong-scope tokens, board/item/vote repositories pass uniqueness and cross-board tests, make check passes, npm run validate passes, and final audit confirms no GitHub mirroring/widget/polling/API-route drift.'
    cadence: 'after each Worker package and at final audit'
    final_proof: 'Receipt-backed command output for D1 repository tests, token negative tests, make check, and npm run validate; direct inspection of migration constraints; and source scan/audit against GitHub mirroring, widget UI, polling, item route, Playwright, and screenshot-specific copied code.'
  intake:
    original_request: '$goal-prep Build Conveyor Board 1 from docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md, preserving the Board 1 D1/auth oracle and excluding GitHub mirroring/widget/polling work.'
    interpreted_outcome: 'Prepare a GoalBuddy board that executes only the D1 data/auth tranche from the accepted implementation plan.'
    input_shape: existing_plan
    audience: 'BugDrop Board implementation workers and reviewers'
    authority: requested
    proof_type: test
    completion_proof: 'D1 migrations apply locally; repository tests prove uniqueness and cross-board isolation; token negative tests reject forged or invalid access; make check and npm run validate pass; final audit maps receipts to Conveyor Board 1 constraints.'
    likely_misfire: 'Accepting a forged user id, allowing duplicate upvotes, leaking records across boards, or drifting into GitHub mirroring/widget/polling/API-route work.'
    blind_spots_considered:
      - 'Board 0 intentionally avoided the Cloudflare D1 test harness; Scout must validate the current package/vitest/wrangler setup before Worker edits.'
      - 'Token claims need enough scope for later embedded use while keeping this tranche independent from dummy host app work.'
      - 'Upvotes are in scope only as repository/data behavior; upvote API routes, polling, and widget UI are later boards.'
      - 'GitHub issue fields may exist as item metadata if required by the schema, but creating/mirroring GitHub Issues is later Board 2 work.'
    existing_plan_facts:
      - 'Input plan path: docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'Conveyor Board 1 goal oracle: D1 migrations apply locally, auth negative tests reject missing/expired/wrong-scope tokens, and board/item/vote repositories pass uniqueness and cross-board tests.'
      - 'Relevant implementation plan slices: Task 3 D1 Schema and Repository Layer; Task 4 Host-Signed Board Tokens.'
      - 'This tranche excludes Task 5 validation/GitHub client, Task 6 item API route, widget UI, polling API, dummy host app, Playwright, comments, downvotes, GitHub Projects, and realtime.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-data-auth/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-data-auth'

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: 'Validate the exact Board 1 D1 harness, repository, and host-signed token decisions before any writes.'
    inputs:
      - 'docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'docs/superpowers/specs/2026-06-03-bugdrop-board-design.md'
      - 'AGENTS.md'
      - 'package.json'
      - 'vitest.config.ts'
      - 'wrangler.toml'
      - 'src/types.ts'
      - 'test/routes.test.ts'
      - 'Current Cloudflare Workers/Vitest/D1 documentation if local package facts are insufficient'
    constraints:
      - 'Read-only.'
      - 'Do not edit implementation files.'
      - 'Inspect only facts needed for Board 1.'
      - 'Do not design or implement GitHub mirroring, item API routes, widget UI, polling, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, or realtime.'
      - 'Explicitly identify any plan snippets that are stale because Board 0 intentionally omitted D1 harness dependencies.'
      - 'Prefer concrete package/config/file evidence over generic advice.'
    expected_output:
      - 'Recommended D1 local test harness for this repo, including any package/config files that must change.'
      - 'Recommended migration constraints and repository methods needed to prove board/item/vote uniqueness and cross-board isolation.'
      - 'Recommended token envelope, required claims, and negative test matrix.'
      - 'Exact candidate Worker package or packages with allowed_files and verification commands.'
      - 'Forbidden carryover list for GitHub mirroring/widget/polling/API-route/screenshot behavior.'
    receipt:
      result: done
      summary: 'Validated Board 1 decisions. The active bugdrop-board repo has the Board 0 scaffold, but still lacks the D1/Vitest harness and DB binding needed for Board 1; a single bounded Worker package can safely add D1 schema/repository tests plus host-signed token helpers without Board 2+ behavior.'
      evidence:
        - 'package.json in the active repo has Hono, Vitest, Wrangler, and @cloudflare/workers-types, but no @cloudflare/vitest-pool-workers.'
        - 'vitest.config.ts is plain Vitest with no cloudflareTest plugin, readD1Migrations, cloudflare:workers env, or migration setup file.'
        - 'wrangler.toml has assets and vars, but no [[d1_databases]] DB binding.'
        - 'src/types.ts Env lacks DB and token secret/audience/issuer bindings.'
        - 'test/routes.test.ts exists and currently covers only the minimal /health route.'
        - 'Official Cloudflare Workers testing docs describe applyD1Migrations(db, migrations) and readD1Migrations() from @cloudflare/vitest-pool-workers/config for D1 migration tests.'
        - 'Official D1 migrations docs describe SQL migration files in the migrations folder, sequentially applied, with D1 binding configuration in Wrangler.'
        - 'Design spec requires D1 tables for boards, board_items, board_votes, and board_events, and requires one upvote per app user per item.'
        - 'Implementation plan Task 3 assumes the D1 harness was added in Task 1, but Board 0 intentionally omitted it; Board 1 must add it now.'
      recommended_harness:
        - 'Add @cloudflare/vitest-pool-workers as a dev dependency.'
        - 'Configure vitest.config.ts with cloudflareTest and readD1Migrations(join(rootDir, "migrations")).'
        - 'Add test/apply-migrations.ts using env from cloudflare:workers and applyD1Migrations(env.DB, env.TEST_MIGRATIONS) before each D1 test.'
        - 'Add wrangler.toml [[d1_databases]] binding DB with local/placeholder database ids suitable for local tests.'
        - 'Add Env.DB plus BOARD_TOKEN_SECRET, BOARD_TOKEN_AUDIENCE, and BOARD_TOKEN_ISSUER to src/types.ts.'
      repository_scope:
        - 'Migration constraints should include boards primary key and UNIQUE(repo_owner, repo_name); board_items FK to boards, status CHECK, upvote_count CHECK >= 0; board_votes FK constraints and UNIQUE(board_id, item_id, external_user_id); board_events autoincrement cursor and idx(board_id, id).'
        - 'Repository methods should cover upsertBoard/getBoard, createItem/getItem, toggleUpvote, listEvents, and board-scoped item/event reads.'
        - 'Tests should prove one board per repo, item creation event, upvote toggle/duplicate prevention, wrong-board item rejection, and cross-board event isolation.'
      token_scope:
        - 'Use compact HMAC-SHA256 token: base64url(JSON claims).base64url(signature), signed over the payload.'
        - 'Required claims: boardId, externalUserId, exp. Optional claims: displayName, email, aud, iss.'
        - 'Negative tests should reject missing token at caller boundary where applicable, malformed format, invalid JSON/base64, tampered signature, expired token, wrong board scope, wrong audience, wrong issuer, missing externalUserId, and wrong secret.'
      candidate_worker_package:
        allowed_files:
          - 'package.json'
          - 'package-lock.json'
          - 'vitest.config.ts'
          - 'wrangler.toml'
          - 'migrations/0001_initial.sql'
          - 'src/types.ts'
          - 'src/lib/ids.ts'
          - 'src/lib/board-repository.ts'
          - 'src/lib/board-token.ts'
          - 'test/apply-migrations.ts'
          - 'test/board-repository.test.ts'
          - 'test/board-token.test.ts'
        verify:
          - 'npm install'
          - 'npm run test -- test/board-repository.test.ts'
          - 'npm run test -- test/board-token.test.ts'
          - 'npm run validate'
          - 'make check'
          - 'direct migration inspection for PK/FK/CHECK/UNIQUE(board_id, item_id, external_user_id)'
          - 'rg audit for forbidden GitHub mirroring, item routes, widget UI, polling, Playwright, comments, downvotes, GitHub Projects, WebSocket, and screenshot/annotation carryover.'
      forbidden_carryover:
        - 'Do not add createGitHubIssue, api.github.com, item API routes, route handlers beyond existing health route, widget UI, polling API, dummy host app, Playwright/E2E, comments, downvotes, GitHub Projects, WebSockets, screenshot, annotation, html-to-image, or feedback widget behavior.'
      scout_corrections:
        - 'The spawned Scout included stale references to /Users/neonwatty/Desktop/bugdrop; PM local inspection corrected those against /Users/neonwatty/Desktop/bugdrop-board.'
        - 'Active repo package name is bugdrop-board, and test/routes.test.ts exists.'

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: medium
    objective: 'Review Scout findings and authorize the largest safe Board 1 Worker package.'
    inputs:
