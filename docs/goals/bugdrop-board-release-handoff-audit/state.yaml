version: 2

goal:
  title: 'BugDrop Board Release Handoff Audit'
  slug: 'bugdrop-board-release-handoff-audit'
  kind: audit
  tranche: 'Post-v0.1.2 release-readiness conveyor board 2: reconcile install-smoke workflow proof and current handoff.'
  status: done
  oracle:
    signal: 'A durable receipt records the current merged release-readiness state after Install Smoke workflow proof passed on main.'
    cadence: 'after source-backed audit and final checks'
    final_proof: 'Receipt with PR, workflow, package, production Worker, local gate, and scope-audit evidence.'
  intake:
    original_request: 'plan out the next several goalbuddy prep boards and manage yourself through them'
    interpreted_outcome: 'Execute the second safe conveyor board by reconciling release handoff documentation after the install-smoke workflow landed.'
    input_shape: audit
    audience: 'BugDrop Board maintainers picking up release-readiness work'
    authority: approved_for_safe_docs_pr_work_no_publish_or_deploy
    proof_type: artifact
    completion_proof: 'Current handoff receipt names merged PRs, green workflow run, current package/deploy state, and next board.'
    likely_misfire: 'Recording a happy-path summary while leaving the first failed workflow run unexplained or making new release/deploy changes.'
    blind_spots_considered:
      - 'A manual workflow can exist but fail after merge because CI does not exercise workflow_dispatch paths.'
      - 'Receipts need both the failed run and fixed run to preserve the actual operational lesson.'
      - 'The next board should be dogfood recheck, not package publishing or production mutation.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
