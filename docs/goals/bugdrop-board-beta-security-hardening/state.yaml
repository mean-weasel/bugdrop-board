version: 2

goal:
  title: 'BugDrop Board Beta Security Hardening'
  slug: 'bugdrop-board-beta-security-hardening'
  kind: existing_plan
  tranche: 'Preserve and land the npm-distribution removal, remediate dependency risk, prove the beta security/build paths, and reconcile readiness claims.'
  status: done
  oracle:
    signal: 'A final audit shows the npm-removal change is isolated and preserved, actionable dependency vulnerabilities are remediated or explicitly risk-accepted, the full beta verification suite passes with adversarial auth/CORS coverage, and readiness docs match the evidence.'
    cadence: 'after each Worker package and at final audit'
    final_proof: 'Receipt-backed commit/diff evidence, audit output, full verification results, adversarial security test results, and a final Judge receipt with full_outcome_complete: true.'
  intake:
    original_request: 'Do steps one through four as a GoalBuddy prep board and advise whether to set up Advanced Security in this repo.'
    interpreted_outcome: 'Prepare a safe execution board that lands the npm-removal work, closes actionable dependency security gaps, proves the result, and makes beta-readiness claims honest.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers and first closed-beta operators'
    authority: requested
    proof_type: test
    completion_proof: 'The four requested steps have receipt-backed proof and final security/readiness review finds no unaddressed beta blocker within scope.'
    likely_misfire: 'Claiming security readiness because the critical-only audit gate passes, while high-severity advisories or contradictory readiness claims remain.'
    blind_spots_considered:
      - 'Advanced Security can add useful signals but cannot replace runtime authorization, CORS, dependency, deployment, and two-user workflow proof.'
      - 'The npm-removal changes are currently part of a dirty worktree and must not be mixed with unrelated hardening changes without an explicit boundary.'
      - 'Automated dependency upgrades may introduce Cloudflare Worker, test-pool, or browser workflow regressions.'
    existing_plan_facts:
      - 'First preserve the completed npm-distribution removal as one focused change.'
      - 'Then update vulnerable dependencies, prioritizing direct runtime and Cloudflare tooling dependencies.'
      - 'Run the complete repository, browser, deployment-dry-run, and adversarial auth/CORS proof.'
      - 'Reconcile readiness documentation with actual security evidence.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-beta-security-hardening/'
    command: 'node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/bugdrop-board-beta-security-hardening'

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: 'Validate the four-step plan against the dirty worktree, security risk, and available proof before any execution.'
    inputs:
      - 'User-provided four-step sequence'
      - 'Current git status and npm-removal plan'
      - 'Repository verification scripts'
    constraints:
      - 'Read-only.'
      - "Preserve the user's sequence unless evidence requires a safer boundary."
      - 'Do not treat a critical-only audit pass as proof that high-severity risk is acceptable.'
    expected_output:
      - 'Validated or corrected execution sequence'
      - 'Exact scope for preserving the npm-removal work'
      - 'Security upgrade boundary and rollback conditions'
      - 'Advanced Security recommendation and proposed configuration scope'
      - 'Required verification and stop conditions'
    receipt:
      result: done
      task_id: T001
      board_path: docs/goals/bugdrop-board-beta-security-hardening/state.yaml
      decision: approved
      full_outcome_complete: false
      rationale: 'The sequence is safe and outcome-moving: first isolate the already-verified npm-removal diff, then remediate dependencies, prove adversarial behavior, reconcile claims, and audit completion. The npm change has one clear tracked-file boundary; the GoalBuddy board itself must be excluded. Security work must prioritize the vulnerable Hono runtime and coupled Cloudflare tooling without an unrelated upgrade sweep. Advanced Security is recommended as additive detection, but enabling remote settings requires separate repository-admin authority and cannot substitute for runtime proof.'
      evidence:
        - "Current status shows 21 tracked npm-removal files plus the new removal plan; docs/goals/bugdrop-board-beta-security-hardening/ is separate untracked board state and must not enter T002's commit."
        - "T002's allowed_files cover the tracked npm-removal diff and docs/superpowers/plans/2026-08-14-remove-npm-distribution.md; exclude every other path, especially docs/goals/. Preserve Worker-hosted /board.js, npm tooling, private:true, and the explicit prepublishOnly refusal."
        - 'Current full `npm audit --json` exits 1 with 13 vulnerabilities: 10 high, 2 moderate, 1 low. All report fixes available; therefore `npm run audit` using `--audit-level=critical` is not sufficient evidence.'
        - 'The direct runtime dependency Hono is affected through 4.12.33, including a high-severity CORS advisory; current installed Hono is 4.12.23 and the compatible wanted release is 4.13.2.'
        - 'The direct toolchain includes esbuild 0.28.0 (fixed compatible release 0.28.2), Wrangler 4.98.0 (advisory range through 4.119.0; wanted 4.123.0), and @cloudflare/vitest-pool-workers 0.16.13 (audit range through 0.20.2; latest 0.21.3). Treat the Cloudflare pool/Miniflare/Wrangler upgrade as one coupled compatibility boundary.'
        - 'T003 must change only package.json/package-lock.json, avoid unrelated latest-version churn, accept only lockfile changes explained by the selected direct upgrades, and stop for any required major upgrade, force/downgrade, config/source change, or repeated Worker/D1/widget/browser regression.'
        - 'Advanced Security recommendation: enable CodeQL default setup for JavaScript/TypeScript, dependency review on pull requests, Dependabot alerts and security updates, secret scanning, and push protection; make relevant checks required where repository policy allows. This is additive detection, not evidence for auth, CORS, D1 isolation, deployment, or two-viewer behavior.'
        - 'Required proof remains sequential: T002 diff/commit plus all listed checks and expected publish refusal; T003 before/after full audit plus full regression suite; T004 explicit missing/expired/malformed/forged/wrong-scope token and allowed/disallowed-origin cases; T005 evidence-matched docs; T999 current-state completion audit.'
      missing_evidence:
        - 'Focused T002 commit identifier and exclusion proof'
        - 'Post-remediation full audit inventory and any explicit residual-risk acceptance'
        - 'Current adversarial auth/CORS and complete browser/deployment verification'
        - 'Evidence-matched final readiness documentation'
        - 'Repository-admin confirmation and authorization before any Advanced Security remote configuration'
      required_board_updates:
        - 'Record this receipt on T001 and mark T001 done.'
        - 'Activate T002 only; keep T003-T005 and T999 sequential because each consumes the preceding receipt.'
        - 'Clarify T003 execution notes: prioritize Hono first, treat Wrangler/vitest-pool/Miniflare as a coupled upgrade, avoid unrelated dependency modernization, and use full `npm audit` rather than the critical-only script as the security gate.'
        - 'Keep Advanced Security configuration outside the four local Worker tasks until explicit remote-mutation authority and repository-plan availability are confirmed.'
