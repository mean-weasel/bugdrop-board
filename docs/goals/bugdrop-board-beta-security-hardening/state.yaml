          - 'Do not add overrides, use --legacy-peer-deps, downgrade packages, modernize unrelated direct dependencies, or edit source/config/test files.'
          - 'Explain every direct change and map every security-driven transitive change or remaining advisory to its dependency path.'
        verify:
