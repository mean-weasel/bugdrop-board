version: 2

goal:
  title: 'BugDrop Board Self-Host Doctor'
  slug: 'bugdrop-board-selfhost-doctor'
  kind: existing_plan
  tranche: 'Closed-beta self-host doctor and setup diagnosis only.'
  status: done
  oracle:
    signal: 'A closed-beta self-hoster can run one non-mutating doctor command and get actionable setup diagnostics before deploy/dogfood.'
    cadence: 'after Worker and final Judge audit'
    final_proof: 'Focused doctor tests, docs scans, repo gates, GoalBuddy receipts, and forbidden-scope scan.'
  intake:
    original_request: 'continue'
    interpreted_outcome: 'Continue the closed-beta conveyor with Board 5: self-host doctor/setup diagnosis only, as recommended by Board 4.'
    input_shape: existing_plan
    audience: 'Closed-beta self-host installers and BugDrop Board maintainers'
    authority: approved
    proof_type: test
    completion_proof: 'Doctor command, core tests, docs, and receipts prove setup diagnosis without mutating Cloudflare, GitHub, D1, npm, or secrets.'
    likely_misfire: 'Building a deployment tool, hosted installer, SDK, or product feature instead of a non-mutating setup doctor.'
    hard_constraints:
      - 'No npm publish or package version bump.'
      - 'No Cloudflare deploy, D1 mutation, Worker secret change, credential change, or secret rotation.'
      - 'No hosted control plane, billing, realtime, comments, downvotes, or GitHub Projects.'
      - 'No status/admin workflow, host token SDK/helpers, sorting/prioritization, accessibility audit, or product UX change.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-selfhost-doctor/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-selfhost-doctor'

active_task: null

