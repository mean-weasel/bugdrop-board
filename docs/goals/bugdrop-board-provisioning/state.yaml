        status: pass
      - command: 'npx wrangler d1 migrations apply DB --local && npm run provision:board -- --repo mean-weasel/final-demo --name "Final Demo" --local && npm run provision:board -- --repo mean-weasel/final-demo --name "Final Demo Updated" --local && npx wrangler d1 execute DB --local --command "SELECT id, repo_owner, repo_name, name FROM boards WHERE id = ''board_mean_weasel_final_demo'';"'
        status: pass
      - command: 'rg -n "resetBoard|__e2e/reset" e2e src/routes/api.ts'
        status: pass
