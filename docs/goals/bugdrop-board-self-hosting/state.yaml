  kind: existing_plan
  tranche: 'Complete Conveyor Board 5: self-hosting docs/config, README/embed instructions, .dev.vars.example, and production-hardening handoff only.'
  status: done
  oracle:
    signal: 'A fresh checkout or clean worktree follows the documented setup to configure local dev, prepare local secrets, apply D1 migrations, build the widget, start or exercise the local Worker/dummy host, and run the E2E smoke without hidden hosted-only assumptions; npm run validate, make check, npm run build:widget, and the selected E2E smoke pass; final audit confirms no out-of-scope feature or production-hardening implementation drift.'
    cadence: 'after Scout, after Worker, and at final audit'
    final_proof: 'Receipt-backed clean-shell or clean-worktree walkthrough output for documented setup commands; direct inspection of README, .dev.vars.example, wrangler.toml, and embed/token instructions; npm run validate, make check, npm run build:widget, E2E smoke output; source/diff audit against realtime, comments, downvotes, GitHub Projects, billing, hosted control plane, and broad production-hardening implementation.'
  intake:
    original_request: '$goal-prep Build Conveyor Board 5 from docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md: self-hosting docs/config, README/embed instructions, .dev.vars.example, and production-hardening handoff only.'
    interpreted_outcome: 'Prepare a GoalBuddy board that executes only Conveyor Board 5: self-hosting documentation/configuration, embed instructions, .dev.vars.example, and a production-hardening handoff.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers and future self-hosters'
    authority: requested
    proof_type: demo
    completion_proof: 'A clean checkout/worktree can follow the documented commands to prepare local config, run migrations, build the widget, and run the local E2E smoke; repository validation gates pass; final audit maps evidence to the self-hosting oracle.'
    likely_misfire: 'Writing a pleasant README that is not executable by a self-hoster, leaving hidden D1/secret/GitHub assumptions, or drifting into implementing production hardening rather than documenting the handoff.'
    blind_spots_considered:
      - 'The plan sample may name GitHub App credentials while the current implementation may use a GitHub issue access token; Scout must inspect the actual Board 2 GitHub client before authorizing docs.'
      - 'The documented D1 migration command must match current wrangler.toml and Wrangler behavior.'
      - 'The embed instructions must align with the Board 4 widget attributes: data-board-id, data-api-url, data-token-endpoint, data-poll-interval, and optional color.'
      - 'The self-hosting pitch should preserve the earlier product promise: hosted users should need only GitHub, while self-hosters own Cloudflare/D1/secrets.'
      - 'Production-hardening belongs in a handoff/checklist unless the user explicitly starts a later implementation board.'
    existing_plan_facts:
      - 'Input plan path: docs/superpowers/plans/2026-06-03-bugdrop-board-implementation.md'
      - 'Conveyor Board 5 plan slug: docs/goals/bugdrop-board-self-hosting'
      - 'Plan oracle: a fresh clone can follow docs to configure local dev, run migrations, start the Worker and dummy host, and execute the E2E smoke without hidden hosted-only assumptions.'
      - 'Plan likely misfire: hosted path works, but self-hosters lack required bindings, secrets, or setup docs.'
      - 'Plan seed board shape: Scout runs docs from scratch in a clean checkout/worktree; Worker adds self-host docs, .dev.vars.example, migration docs, and config checks; Judge runs documented commands and records proof.'
      - 'Plan Task 10 files include .dev.vars.example, README.md, wrangler.toml, and AGENTS.md if verification commands change.'
      - 'Completed foundation: Board 1 D1/auth, Board 2 GitHub mirror, Board 3 voting/polling APIs, and Board 4 embedded widget/dummy host/E2E.'
      - 'Board 4 final receipt recommends this Board 5 as the self-hosting/hardening handoff.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

