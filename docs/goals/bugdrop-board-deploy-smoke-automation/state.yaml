      - 'make check'
      - 'node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.8/skills/goalbuddy/scripts/check-goal-state.mjs docs/goals/bugdrop-board-deploy-smoke-automation/state.yaml'
      - 'scope scan for forbidden product, publish, deploy, or credential changes'
    stop_if:
