version: 2

goal:
  title: 'BugDrop Board Deploy Smoke Automation'
  slug: 'bugdrop-board-deploy-smoke-automation'
  kind: existing_plan
  tranche: 'Post-v0.1.0 deploy proof hardening: reusable deployed Worker smoke and optional workflow smoke input.'
  status: done
  oracle:
    signal: 'A deployed Worker URL can be verified with npm run deploy:smoke, and Deploy Worker can run the same check after a real deploy when smoke_url is provided.'
    cadence: 'after Worker implementation and final audit'
    final_proof: 'Local smoke against https://board.bugdrop.dev, workflow/docs diff inspection, validation gates, and scope scan.'
  intake:
    original_request: 'Continue the BugDrop Board release-readiness conveyor while the user is away.'
    interpreted_outcome: 'Add the next safe release-readiness proof automation slice without mutating production or publishing.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers and self-hosters promoting Worker deployments'
    authority: approved_for_safe_local_and_pr_work
    proof_type: artifact
    completion_proof: 'A command and optional workflow step verify deployed Worker health/assets from an explicit URL.'
    likely_misfire: 'Accidentally deploying production, changing secrets, or adding runtime product behavior while improving deploy proof.'
    blind_spots_considered:
      - 'Current deploy docs use manual curl commands but do not provide a reusable smoke command.'
      - 'Deploy workflow cannot infer every self-host URL, so the smoke URL must be explicit and optional.'
      - 'The smoke should verify only safe public endpoints.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-deploy-smoke-automation/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-deploy-smoke-automation'

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: 'Identify the smallest safe deploy proof automation slice.'
    receipt:
      result: done
      summary: 'Scout found deploy docs and workflow rely on manual curl smoke checks; adding a reusable public-endpoint smoke command plus optional workflow input is the safest next hardening slice.'
      evidence:
        - 'README Environment Promotion uses curl /health and curl -I /board.js as manual deploy checks.'
        - '.github/workflows/deploy.yml deploys and cleans secrets but has no optional post-deploy URL smoke.'
        - 'Production Worker https://board.bugdrop.dev is live and can be used for non-mutating local proof.'

  - id: T002
    type: judge
    assignee: Judge
    status: done
    objective: 'Authorize deploy smoke automation Worker slice.'
