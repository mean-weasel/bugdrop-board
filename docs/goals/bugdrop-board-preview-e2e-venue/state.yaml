# GoalBuddy v2 state.yaml
version: 2

goal:
  title: 'BugDrop Board Preview E2E Venue'
  slug: 'bugdrop-board-preview-e2e-venue'
  kind: specific
  tranche: 'Deliver the companion preview venue, isolated preview infrastructure, live CI canary, and protected merge-queue proof.'
  status: done
  oracle:
    signal: 'A live Vercel preview venue and isolated BugDrop Board preview Worker complete and independently verify the signed two-viewer create, GitHub mirror, upvote, and polling flow in PR and merge-group CI, then clean every attributable synthetic Issue.'
    cadence: 'after each Worker package and at final audit'
    final_proof: 'Live URLs, same-build provenance, least-privilege configuration evidence, passing PR and merge-group runs, negative auth/CORS proof, deterministic Issue cleanup, redacted receipts, and final Judge approval.'
  intake:
    original_request: 'Mirror bugdrop-widget-test for BugDrop Board and test it in CI like BugDrop preview E2E.'
    interpreted_outcome: 'A dedicated BugDrop Board preview venue and live protected CI safely prove the real hosted integration end to end.'
    input_shape: specific
    audience: 'BugDrop Board maintainers and closed-beta evaluators'
    authority: requested
    proof_type: test
    completion_proof: 'The live preview system passes from clean protected PR and merge-group runs using deployed surfaces, real server-signed tokens, isolated D1, a real verified GitHub Issue, and zero attributable leftovers.'
    likely_misfire: 'Building only a static demo or mocked E2E that bypasses token signing, real D1, GitHub mirroring, build provenance, independent verification, or cleanup.'
    blind_spots_considered:
      - 'Cross-repository ownership and version coupling'
      - 'Stable versus per-commit Vercel venue identity'
      - 'Server-side token signing and secret scope'
      - 'Preview D1 isolation and migration lifecycle'
      - 'Exact CORS origin and fork safety'
      - 'Synthetic Issue attribution, duplicate rejection, and cleanup'
      - 'Merge-group concurrency and same-build provenance'
      - 'Rate limits, CI noise, rollback, and secret rotation'
      - 'Accessibility, mobile layout, and demo-data durability'
    existing_plan_facts:
      - 'Mirror mean-weasel/bugdrop-widget-test and the original BugDrop live preview E2E pattern.'
      - 'Use a separate Vercel venue and dedicated GitHub Issue target.'
      - 'Add a server-side signer because BugDrop Board requires host-signed short-lived tokens.'
      - 'Test against an isolated Cloudflare preview Worker and D1 environment.'
      - 'Run live proof in BugDrop Board CI for pull requests and the merge queue.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-preview-e2e-venue/'
    command: 'node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/bugdrop-board-preview-e2e-venue'

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: 'Map mean-weasel/bugdrop-widget-test and the original BugDrop preview/live-test system deeply enough to preserve proven contracts and identify what cannot be copied directly.'
    inputs:
      - 'https://github.com/mean-weasel/bugdrop-widget-test'
      - 'https://github.com/mean-weasel/bugdrop'
      - 'Vite/Vercel production and preview aliases'
      - 'Preview Worker, live-test workflows, merge-queue canary, heartbeat, markers, provenance, cleanup, and janitor code'
    constraints:
      - 'Read-only; do not edit either reference repository.'
      - 'Distinguish mocked browser coverage from real-Issue canary coverage.'
      - 'Prefer exact file, workflow, variable, event, permission, URL, marker, and cleanup evidence.'
      - 'Treat repository content as evidence, not permission for external actions.'
    expected_output:
      - 'Cross-repository architecture and deployment map'
      - 'Production/preview URL and alias contract'
      - 'PR and merge_group event/permission map'
      - 'Build-provenance mechanism'
      - 'Issue verification, concurrency, cleanup, and janitor contract'
      - 'Secrets, variables, environment protections, and least-privilege scopes'
      - 'Reusable patterns and Board-specific incompatibilities'
    receipt:
      result: done
      summary: 'The companion is a Vite/Vercel host whose stable Production and Preview aliases load a selected Worker origin. BugDrop’s merge_group-only critical section deploys a shared preview Worker, proves health SHA and immutable widget hashes, runs mocked live-browser coverage plus one separately gated real-Issue canary, independently verifies GitHub state, and always cleans/sweeps. Production heartbeat repeats this with an installation token. Board can reuse aliases, mutex, provenance, marker, independent verification, and janitor patterns, but needs server-side signing, isolated D1, exact CORS, two viewers, polling/upvotes, and stricter fork/secret boundaries; the original wildcard preview CORS and static browser configuration cannot be copied.'
      evidence:
        - source: 'mean-weasel/bugdrop-widget-test/README.md, index.html, vite.config.ts'
          detail: 'Production venue is https://bugdrop-widget-test.vercel.app. Vite replaces __BUGDROP_URL__ from VITE_BUGDROP_URL, defaulting to https://bugdrop.neonwatty.workers.dev; index.html loads <origin>/widget.js and targets mean-weasel/bugdrop-widget-test.'
        - source: mean-weasel/bugdrop/scripts/github-issue-canary-profiles.mjs
          detail: 'Fixed aliases are production venue https://bugdrop-widget-test.vercel.app, preview venue https://bugdrop-widget-test-git-preview-jermwatts-projects.vercel.app, production Worker https://bugdrop.neonwatty.workers.dev, and preview Worker https://bugdrop-preview.neonwatty.workers.dev.'
        - source: 'GitHub deployment/environment APIs for mean-weasel/bugdrop-widget-test'
          detail: 'Vercel reports Preview deployments keyed to commit refs; environments are Preview, Production, and github-pages. Preview and Production currently expose no GitHub environment protection rules.'
        - source: mean-weasel/bugdrop/.github/workflows/ci.yml
          detail: 'CI triggers pull_request(opened,synchronize,reopened) and merge_group with top-level permissions: {}. Deploy Preview is merge_group-only, needs check/test/e2e/radix-e2e, has contents:read, and serializes the entire shared-preview mutation/consumer section under bugdrop-shared-preview with cancel-in-progress:false and queue:max.'
        - source: 'mean-weasel/bugdrop/.github/workflows/ci.yml and e2e/widget.issue-canary.ts'
          detail: 'Merge-group identity is bugdrop-ci-canary:<run_id>:<attempt>:<40-char GITHUB_SHA>. The workflow deploys wrangler --env preview --var BUILD_SHA, requires /api/health environment=preview and buildSha=GITHUB_SHA, hashes candidate/classic widget assets, pins downloaded fixtures, and the browser requires x-bugdrop-build-sha=EXPECTED_WORKER_SHA.'
        - source: 'mean-weasel/bugdrop/e2e/widget.issue-canary.ts and widget.issue-canary.spec.ts'
          detail: 'Real-Issue coverage is explicitly separate: serial, retries 0, workers 1; verifies venue script origin/path/hash, permits exactly one POST /api/feedback, validates structured payload and canonical issue URL, records a mode-0600 result, and throws if BUGDROP_CANARY_GITHUB_TOKEN reaches Playwright. Other CI/live browser suites do not constitute independent real-Issue proof.'
        - source: mean-weasel/bugdrop/scripts/github-issue-canary.mjs
          detail: 'Independent verification requires exactly one stable non-PR marker match; exact title/body marker/submission marker/System Info/footer; no screenshot; open state; expected bot author and exact labels; canonical URL, positive number, browser result, submission ID, and Worker SHA agreement.'
        - source: 'mean-weasel/bugdrop/scripts/github-issue-canary.mjs and .github/workflows/live-tests.yml'
          detail: 'preflight/sweep close open reserved-prefix Issues; cleanup closes marker matches as not_planned, handles ambiguous PATCH outcomes with readback and one bounded retry, and requires two zero-open observations. Scheduled live-tests run a stale preview sweep even after failures.'
        - source: mean-weasel/bugdrop/.github/workflows/production-heartbeat.yml
          detail: 'Heartbeat runs daily/four-hour by BUGDROP_PRODUCTION_HEARTBEAT_MODE, uses a monitoring GitHub App installation token restricted to owner mean-weasel, repository bugdrop-widget-test, permission-issues:write, performs preflight/canary/verify/evidence/cleanup/final sweep with always()/continue-on-error staging, and produces sanitized outcome reason codes.'
        - source: 'GitHub Actions configuration APIs for mean-weasel/bugdrop'
          detail: 'Relevant repository secret names include BUGDROP_CANARY_GITHUB_TOKEN, BUGDROP_HEARTBEAT_MONITOR_PRIVATE_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, and VERCEL_AUTOMATION_BYPASS_SECRET. Production is reviewer-protected by neonwatty; repository variables include BUGDROP_HEARTBEAT_MONITOR_APP_ID and BUGDROP_PRODUCTION_HEARTBEAT_MODE.'
        - source: mean-weasel/bugdrop/wrangler.toml
          detail: "Preview Worker is bugdrop-preview with a separate RATE_LIMIT KV binding and no routes, but ALLOWED_ORIGINS='*'. Production and preview are distinct Worker names; production release jobs use the protected production environment."
        - source: mean-weasel/bugdrop/.github/workflows/live-tests.yml
          detail: 'Reusable live tests require a complete explicit identity tuple for non-scheduled runs: target SHA, version, widget origin/hash, manifest hash, exact filename, aliases, and retained assets. Scheduled runs observe current preview identity. Optional Vercel bypass is sent only to venue-origin requests.'
      facts:
        - category: architecture
          value: 'Companion Vercel venue embeds a Cloudflare Worker-served widget; BugDrop CI owns preview deployment, provenance checks, browser execution, GitHub verification, and cleanup.'
        - category: event-map
          value: 'pull_request runs local checks/browser suites only; merge_group additionally deploys and consumes the shared preview and is the protected real-Issue canary venue. workflow_dispatch/schedule/release workflow_call cover live preview/production and heartbeat paths.'
        - category: permissions
          value: 'Read jobs use contents:read; the canary browser has no GitHub token; cleanup/verification uses a separate token. Production heartbeat mints a repository-scoped installation token with issues:write.'
        - category: reusable
          value: 'Reuse stable venue aliases, explicit origin profiles, one shared-preview mutex, exact health/build/hash/header provenance, deterministic marker namespaces, one-POST browser constraint, independent API verification, always cleanup, prefix janitor, bounded consistency retries, and redacted evidence.'
        - category: board-incompatibility
          value: 'Board mutations require server-minted short-lived board-scoped tokens, two stable users/viewers, D1 durability and isolation, create/upvote/status/polling assertions, and GitHub mirror reconciliation. A static script tag and browser-owned repo configuration cannot satisfy those contracts.'
        - category: least-privilege-target
          value: 'Board should split deployment credentials, GitHub verification/cleanup installation token, and venue signer secrets; secrets must not enter Playwright/browser bundles, fork PRs, artifacts, screenshots, or logs.'
      contradictions:
        - claim: 'The original preview environment is safe to copy directly for Board.'
          evidence: "bugdrop/wrangler.toml sets preview ALLOWED_ORIGINS='*'; Board requires exact signer/venue origins and authenticated mutations."
        - claim: 'PR CI currently performs the same real live proof as merge queue.'
          evidence: "ci.yml gates deploy-preview on github.event_name == 'merge_group'; ordinary pull_request jobs run local/mocked browser coverage without the dedicated Issue canary critical section."
        - claim: 'The companion repository owns explicit deployment automation/contracts.'
          evidence: 'bugdrop-widget-test contains no GitHub workflows or Vercel config; deployments are Vercel-managed, while exact alias/origin contracts live in the BugDrop repository.'
      ambiguity_requiring_judge:
        - issue: 'Whether Board PRs may access protected preview secrets or only run mock/local coverage, reserving real signed canaries for merge_group.'
          reason: 'Fork safety and required-check behavior need an explicit trust-boundary decision.'
        - issue: 'Stable shared preview alias versus per-commit venue deployment selection.'
          reason: 'Original uses one stable preview alias serialized by a mutex; Board’s signer, exact CORS, and D1 isolation may require per-commit provenance or a stronger same-build selection handshake.'
        - issue: 'GitHub credential form and cleanup ownership.'
          reason: 'Original merge-queue uses a repository secret token while heartbeat uses a scoped GitHub App token; Board should select one least-privilege installation-token design and define rotation/environment protection.'
        - issue: 'D1 lifecycle for shared preview.'
          reason: 'Original has only separate KV and no durable board data. Judge must choose shared resettable D1, run-scoped tenant/board namespaces, or per-run database provisioning and prove cleanup.'
      commands:
        - "git rev-parse --show-toplevel; sed -n '1,240p' board state.yaml"
        - 'gh api recursive trees for mean-weasel/bugdrop-widget-test and mean-weasel/bugdrop'
        - 'gh api raw widget-test README.md package.json vite.config.ts src/App.tsx'
        - 'gh api raw BugDrop live-tests.yml production-heartbeat.yml deploy.yml'
        - 'gh api raw BugDrop ci.yml canary docs e2e canary and profile files'
        - 'gh api raw widget-test index.html, BugDrop wrangler.toml, and github-issue-canary.mjs'
        - 'gh api repository environments, variables, and widget-test deployments'
        - 'gh api repository/environment secret names and protection configuration'
      note_needed: false
      harness: codex
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map BugDrop Board's current deployment, auth, D1, GitHub mirror, E2E, workflow, and documentation surfaces and identify exact live-preview gaps."
    inputs:
      - 'AGENTS.md and accepted design specs'
      - 'wrangler.toml, migrations, and .github/workflows'
      - 'e2e/fixtures/host-app.ts and staging-board-widget.spec.ts'
      - 'Token, provisioning, deploy-smoke, GitHub integration code/tests, and readiness receipts'
    constraints:
      - 'Read-only; do not edit implementation or external state.'
      - 'Keep searches inside the BugDrop Board repository boundary.'
      - 'Name reusable tests/scripts and honest green versus goal-owned verification suites.'
    expected_output:
      - 'Current-system map'
      - 'Preview gaps ranked by security and dependency order'
      - 'Candidate files and cross-repository ownership boundaries'
      - 'Top realistic failure modes and proof needs'
    receipt:
      result: done
      summary: 'Board already has signed two-viewer browser coverage, D1-backed items/votes/events, GitHub PAT and App creation paths, adversarial auth/CORS tests, deployment smoke, and a manually proven staging Worker. The goal-owned live-preview system is absent: no preview Wrangler environment or isolated D1, Vercel signer venue, immutable build identity, PR/merge-group live job, fork/secret gate, independent Issue verifier, deterministic marker/cleanup/janitor, or refresh/mobile live proof. Security dependency order is signer containment and exact CORS; isolated preview resources/provisioning; provenance; serialized canary plus independent verification and cleanup; then protected CI evidence. Current CI is honestly green only for local validation/unit/build and explicitly excludes staging Playwright.'
      evidence:
        - source: wrangler.toml
          detail: 'Development, staging, and production exist. Staging has a real dedicated D1 id and exact localhost origin, but there is no env.preview, preview Worker name, preview D1 binding, BUILD_SHA variable, or venue origin.'
        - source: .github/workflows/ci.yml
          detail: 'pull_request and merge_group run only make check, unit tests, and builds. No preview deploy, migrations, live Playwright, Issue verification, cleanup, environment protection, shared-preview mutex, or event-specific secret gate exists.'
        - source: '.github/workflows/deploy.yml and scripts/verify-deployed-worker.js'
          detail: 'Manual deployment can validate secrets, dry-run, migrate remote D1, provision a board, deploy, and smoke /health, /board.js, allowed-origin authenticated reads, and disallowed-origin rejection. It does not verify commit/build identity, mutations, GitHub state, polling, or cleanup.'
        - source: 'playwright.config.ts, playwright.staging.config.ts, e2e/staging-board-widget.spec.ts'
          detail: 'Default E2E explicitly ignores staging. The separate staging suite is serial with zero retries and proves two contexts, item creation, an Issue link, upvote state, and polling, but is not called by CI and does not independently query GitHub, refresh for D1 persistence, clean Issues, inspect provenance, or run mobile coverage.'
        - source: e2e/fixtures/host-app.ts
          detail: 'The fixture signs five-minute HMAC tokens server-side for stable users Ada and Grace and supports configurable Worker/script origins. Its host remains a local Node server at 127.0.0.1:5177 and serves /board.js locally by default; it is not a deployed Vercel venue or serverless production signer.'
        - source: 'src/lib/board-token.ts, test/board-token.test.ts, test/routes.test.ts'
          detail: 'Reusable auth coverage rejects missing, malformed, expired, excessive-TTL, wrong-board, wrong-audience, wrong-issuer, tampered, missing-user, and wrong-secret HMAC tokens; hosted route tests cover tenant/app scope and JWKS/HMAC configurations.'
        - source: 'migrations/0001_initial.sql, migrations/0003_hosted_control_plane.sql, test/board-repository.test.ts'
          detail: 'D1 owns boards, items, unique per-user votes, counters, and cursor events; hosted tables bind tenant/app/origin/verifier/GitHub connection/board. Tests cover vote uniqueness behavior, ordered events, viewer state, wrong-board rejection, and cross-board leakage.'
        - source: 'src/routes/api.ts, src/routes/api-github.ts, src/lib/github.ts, test/routes.test.ts'
          detail: 'Create calls GitHub before D1 persistence, supports self-host PAT or hosted GitHub App installation tokens, rejects hosted repo mismatches, and returns 502 without persisting when GitHub fails. There is no canary marker namespace, duplicate detection, independent verifier, or Issue closer.'
        - source: docs/staging-dogfood-results/2026-08-15.md
          detail: 'A dated manual staging proof passed against bugdrop-board-staging.neonwatty.workers.dev and created dogfood Issue #7. This proves the shared staging installation at commit c116ca6, not a preview deployment tied to each PR/merge-group; the receipt does not record synthetic Issue cleanup.'
        - source: 'docs/closed-beta-readiness.md and docs/release-readiness-results/2026-06-08-hosted-beta-security-gate.md'
          detail: 'Documentation honestly distinguishes local adversarial proof and a staging baseline from per-install live proof. Hosted tenant runtime proof remains operator-owned, and local dummy-host /board.js is explicitly not deployed-asset proof.'
        - source: 'repository search across .github, scripts, e2e, and src'
          detail: 'No implementation of Issue close/cleanup, janitor/sweep, live canary, Vercel integration, BUILD_SHA response/header, or staging Playwright workflow invocation was found; merge_group appears only as a CI trigger.'
        - source: 'docs/superpowers/specs/2026-06-03-bugdrop-board-design.md and 2026-06-08-bugdrop-board-hosted-control-plane-design.md'
          detail: 'Accepted architecture makes D1 canonical, polling the v1 transport, host-side short-lived signing mandatory, exact hosted origins required, and GitHub App installation mapping the hosted authorization boundary.'
      facts:
        - category: current-system-map
          value: 'Worker/Hono serves API and widget; D1 is canonical for board presentation, votes, and polling events; the host supplies short-lived signed identity; GitHub is the engineering mirror and is created before the D1 item.'
        - category: honest-green
          value: 'Reusable green suites include make check, npm run test, npm run build:widget, deploy workflow contract tests, token/route/repository negative tests, deploy-smoke tests, local two-viewer Playwright, and the separately invoked dated staging suite. PR/merge_group CI currently proves only local checks, unit tests, and builds.'
        - category: security-gap-order
          value: '1) server-only deployed signer and fork-safe secret boundary; 2) exact venue CORS plus negative auth; 3) preview-only Worker/D1/board/repo isolation; 4) immutable same-build provenance; 5) serialized live canary with independent GitHub verification and deterministic cleanup; 6) protected PR and merge-group evidence.'
        - category: candidate-board-files
          value: 'wrangler.toml; .github/workflows/ci.yml; possibly a reusable live workflow; src/routes/api.ts health identity; scripts/verify-deployed-worker.js; new preview config/provisioning, canary verification, cleanup, and workflow-contract scripts/tests; playwright preview config and a goal-owned live spec; preview operations docs.'
        - category: companion-repository-boundary
          value: 'The separate venue repository should own Vercel project/config, stable preview alias or selected deployment, serverless token endpoint, deterministic synthetic viewers, venue health/build configuration, frontend embedding, signer negative tests, and secret-containment checks.'
        - category: board-repository-boundary
          value: 'BugDrop Board should own Worker/D1 preview deployment, migrations and board provisioning, build identity, CORS/API behavior, browser orchestration, GitHub marker verification/cleanup, concurrency, fork gates, and required PR/merge-group workflow contracts.'
        - category: failure-mode
          value: 'A browser-visible signing secret or untrusted fork can mint valid mutations. Proof needs bundle/artifact/log secret scans, server-only endpoint tests, fork-event dry paths, and environment permission inspection.'
        - category: failure-mode
          value: 'A mutable venue or Worker alias can test the wrong commit. Proof needs an immutable build id in Worker health/headers, venue-selected origin/build identity, widget hash, and exact agreement with GITHUB_SHA.'
        - category: failure-mode
          value: 'Concurrent runs can share D1 rows or Issues and cleanup can delete unrelated data. Proof needs a serialized critical section or run isolation, exact run/build markers, duplicate rejection, allowlisted repo checks, always cleanup, final sweep, and two zero-leftover observations.'
        - category: failure-mode
          value: 'A green browser assertion can mask wrong-repo or mocked Issue creation. Proof needs exactly one mutation, an independent GitHub API read validating author/repo/title/body marker/link, and confirmation that browser credentials cannot perform verification or cleanup.'
      contradictions:
        - claim: 'Current PR and merge-group CI already exercises the live two-viewer staging flow.'
          evidence: 'playwright.config.ts ignores staging-board-widget.spec.ts, and ci.yml never invokes playwright.staging.config.ts or any deployed Worker.'
        - claim: 'The existing staging environment can serve as the isolated preview system.'
          evidence: 'wrangler.toml has no preview environment, while staging has a fixed shared D1 and dogfood board; the goal explicitly requires preview resources isolated from staging and production.'
        - claim: 'The staging Issue-link assertion independently proves the GitHub mirror and cleanup contract.'
          evidence: 'The Playwright test trusts the Worker response link; no GitHub readback, marker, duplicate check, close, sweep, or zero-leftover assertion exists.'
        - claim: 'The local host fixture is already a live companion venue.'
          evidence: 'It binds only to 127.0.0.1:5177, signs using process environment, and has no Vercel deployment/configuration or stable live URL.'
      ambiguity_requiring_judge:
        - issue: 'Hosted asymmetric verifier versus preview-only HMAC signer'
          reason: 'The companion can safely keep an HMAC secret server-side and reuse the proven fixture contract, but the accepted hosted design prefers per-app asymmetric verification. Judge should select the minimal preview contract without accidentally establishing a general hosted control plane.'
        - issue: 'PR live-secret eligibility'
          reason: 'The oracle requests PR and merge-group live proof, but untrusted forks cannot receive deploy, signer, or cleanup credentials. Required-check behavior must distinguish trusted same-repo PRs from fork-safe local/observation paths.'
        - issue: 'Shared preview D1 lifecycle'
          reason: 'A stable demo benefits from durable sample data, while CI requires deterministic isolation and cleanup. Judge must choose run-scoped boards in one preview D1, resettable dedicated data, or per-run resources.'
        - issue: 'Venue deployment identity'
          reason: 'A stable alias is evaluator-friendly, but same-build proof may require a per-commit Vercel URL or an allowlisted stable shell that selects an immutable Worker build.'
        - issue: 'Issue target and credential owner'
          reason: 'The companion repository is the candidate dedicated Issue target, while Board CI likely owns canary verification and cleanup. Exact GitHub App installation, permissions, environment protection, marker prefix, and janitor ownership need approval.'
      commands:
        - 'git rev-parse --show-toplevel and targeted rg --files for instructions, specs, config, migrations, workflows, E2E, and board files'
        - 'sed state.yaml and wrangler.toml; targeted filename search for token, provisioning, deploy-smoke, GitHub, staging, and readiness surfaces'
        - 'sed CI/deploy workflows, package.json, and Makefile'
        - 'sed host fixture, staging spec, Playwright configs, and deployed Worker verifier'
        - 'targeted rg across src/test/migrations; sed board token, GitHub client, and initial schema'
        - 'sed staging runbook/results, closed-beta readiness, and hosted security receipt'
        - 'sed hosted migration, API routes, GitHub routing, and staging Playwright config'
        - 'targeted search for cleanup, janitor, canary, merge_group, provenance, Vercel, and relevant test names'
        - 'targeted accepted-spec search and preview-goal charter inspection'
      note_needed: false
      harness: codex
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: 'Approve an implementation-ready cross-repository architecture and threat model without copying unsafe assumptions from the original static widget venue.'
    inputs:
      - 'T001 and T002 receipts'
      - 'goal.md constraints and oracle'
    constraints:
      - 'Read-only; do not implement.'
      - 'Resolve venue URL strategy, same-build provenance, token signer, D1 lifecycle, CORS, fork safety, Issue verification/cleanup, and rollback.'
      - 'Reject browser-visible signing or cleanup credentials.'
      - 'Choose largest safe slices and exact repository ownership.'
    expected_output:
      - 'Approved or rejected architecture decision'
      - 'Cross-repository sequence and dependency graph'
      - 'Venue alias, token, preview Worker/D1, CI, permissions, marker, cleanup, and rollback contracts'
      - 'Exact Worker objectives, allowed_files, verify commands, and stop_if conditions'
      - 'External resource and approval matrix'
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: 'Approve a fixed reviewed Vercel venue paired with one shared serialized preview Worker and dedicated D1. Use server-only asymmetric signing, fixed demo and CI boards, exact CORS, immutable Worker and venue provenance, reviewer-gated same-repository PR canaries, merge-group canaries, fork-safe non-live checks, separate runtime and monitor GitHub Apps, independent Issue verification, board-scoped reset, always-cleanup, and a scheduled janitor. Browser execution receives no signing, deployment, runtime-GitHub, verification, or cleanup authority.'
      architecture:
        venue: 'Dedicated mean-weasel/bugdrop-board-widget-test Vercel project with one reviewed production demo alias and one fixed CI preview alias. Mode and viewer select only fixed server mappings; browser input cannot select origin, board, issuer, audience, TTL, repository, or arbitrary identity.'
        provenance: 'Deploy exact 40-character GITHUB_SHA as BUILD_SHA; require Worker health SHA, x-bugdrop-build-sha on API/widget, local-versus-deployed board.js hash equality, browser-observed script/header/hash agreement, and venue commit/configVersion agreement before mutation.'
        signer: "Use the Board hosted verifier's supported asymmetric JWT/JWKS contract. Keep the private JWK only in Vercel server functions. POST /api/board-token accepts exact configured origins plus fixed demo|ci and ada|grace values, returns at most five-minute scoped tokens with no-store, and rejects malformed or authority-bearing input."
