  - id: T002
    type: worker
    assignee: Worker
    status: done
    objective: 'Implement privacy/API response minimization for authenticated board item reads.'
    allowed_files:
      - 'src/routes/api.ts'
      - 'src/lib/board-repository.ts'
      - 'src/types.ts'
      - 'test/routes.test.ts'
      - 'test/board-repository.test.ts'
      - 'docs/goals/bugdrop-board-closed-beta-guardrails/notes/T002-worker.md'
      - 'docs/goals/bugdrop-board-closed-beta-guardrails/state.yaml'
    acceptance:
      - 'Worker first inspects the already-dirty `src/routes/api.ts` and `test/routes.test.ts` changes from this session and either keeps them with proof or revises them inside this T002 scope.'
      - 'Authenticated viewer item reads no longer expose `createdByExternalUserId`.'
      - 'The widget-visible item contract still includes id, title, description, status, GitHub issue metadata, upvote count, and viewer upvote state.'
      - 'Tests prove browser-supplied user ids are still ignored and stable creator ids are absent from viewer responses.'
      - 'No GitHub mirror, token auth, polling, upvote, or widget behavior regresses.'
    verify:
      - 'npm run test -- test/routes.test.ts test/board-repository.test.ts'
      - 'npm run typecheck'
      - 'focused source scan for `createdByExternalUserId` exposure in route JSON responses'
    stop_if:
      - 'The privacy fix requires a schema migration, product behavior change, admin/status workflow, npm publish/version bump, Cloudflare deploy, credential/secret change, hosted control plane, billing, realtime, comments, downvotes, GitHub Projects, or unrelated product behavior.'
    receipt:
      result: done
      changed_files:
        - 'src/routes/api.ts'
        - 'test/routes.test.ts'
      summary: 'API responses for create/list/upvote now use a public item projection that omits stable creator identifiers while preserving widget-visible item fields.'
      commands:
        - command: 'npm run test -- test/routes.test.ts test/board-repository.test.ts'
          status: pass
          evidence: '20 focused route/repository tests passed.'
        - command: 'npm run test -- test/routes.test.ts test/board-repository.test.ts test/verify-clean-room-install.test.ts'
          status: pass
          evidence: '22 focused tests passed after all Board 4 edits.'
        - command: 'npm run typecheck'
          status: pass
          evidence: 'Worker and widget TypeScript typecheck passed.'
        - command: 'rg -n "createdByExternalUserId|created_by_external_user_id" src/routes src/widget test/routes.test.ts'
          status: pass
          evidence: 'Matches are negative route tests and repository-storage assertions only, not route response projection.'
      note: 'docs/goals/bugdrop-board-closed-beta-guardrails/notes/T002-worker.md'

