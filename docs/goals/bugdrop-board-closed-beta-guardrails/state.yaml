      - 'Deploy workflow refuses or safely defaults production GitHub Environment runs that omit the intended Wrangler environment.'
      - 'Dry-run, remote migrations, provisioning, and deploy commands cannot silently fall back to the top-level development Wrangler config for production.'
      - 'Workflow exposes and forwards a disallowed-origin smoke input to `npm run deploy:smoke`.'
      - '`.deploy.secrets` is ignored by git and still removed by the workflow.'
      - 'Existing package/install workflow verifiers are updated or extended if needed to prove the workflow contract.'
    verify:
      - 'npm run package:workflow:check'
      - 'npm run install:smoke:workflow'
      - 'npm run check:actions-node24'
      - 'git check-ignore -v .deploy.secrets'
      - 'focused workflow scan for `wrangler_environment`, `--env`, `smoke_cors_disallowed_origin`, and `.deploy.secrets` cleanup'
    stop_if:
