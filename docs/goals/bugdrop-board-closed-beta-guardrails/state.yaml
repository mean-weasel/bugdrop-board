version: 2

goal:
  title: 'BugDrop Board Closed Beta Guardrails'
  slug: 'bugdrop-board-closed-beta-guardrails'
  kind: audit
  tranche: 'Critique-driven closed-beta privacy, deploy, CORS, secret-file, and setup-trust guardrails only.'
  status: done
  oracle:
    signal: 'The highest-risk safe gaps from three independent closed-beta critiques are fixed or explicitly deferred with proof.'
    cadence: 'after each Scout/Judge/Worker tranche and final Judge audit'
    final_proof: 'Focused privacy/deploy/setup tests, workflow/source inspection, repo gates, GoalBuddy receipts, and forbidden-scope scan.'
  intake:
    original_request: 'Use three independent agents to critically analyze the app for closed beta and set up a conveyor of GoalBuddy boards if sufficient gaps remain.'
    interpreted_outcome: 'Turn the independent critique findings into a safe autonomous conveyor, starting with the highest-value closed-beta guardrails that do not require excluded product or production operations.'
    input_shape: audit
    audience: 'BugDrop Board maintainers and closed-beta self-host operators'
    authority: approved
    proof_type: test
    completion_proof: 'Privacy-minimized item reads, safer deploy workflow, disallowed-origin deploy smoke wiring, local secret-file ignore, runtime/package metadata hygiene, and final verification receipts.'
    likely_misfire: 'Implementing broad product features such as status/admin workflow, hosted installer/control plane, billing, realtime, comments, downvotes, GitHub Projects, npm publishing, Cloudflare deploys, or secret changes under the banner of beta readiness.'
    blind_spots_considered:
      - 'Docs can say closed-beta safe while the API still leaks unnecessary stable host user ids.'
      - 'Production GitHub environment secrets can be paired with a blank Wrangler env and hit top-level development config.'
      - 'CORS negative proof can exist in a helper but be skipped in the deploy workflow.'
      - 'A deploy secret temp file can become a local commit footgun if not ignored.'
      - 'Beta installers can lose trust when runtime/package requirements and artifact posture are implicit.'
      - 'Status/admin workflow is a real beta gap but conflicts with standing exclusions and needs explicit user override.'
    hard_constraints:
      - 'No npm publish or package version bump.'
      - 'No Cloudflare deploy, credential change, secret rotation, or secret file edit.'
      - 'No hosted control plane, billing, realtime, comments, downvotes, or GitHub Projects.'
      - 'No status/admin workflow unless the user explicitly overrides the standing exclusion.'
      - 'No unrelated product behavior.'
    critique_disposition:
      board_4_fixes:
        - 'Privacy/API response minimization: remove unnecessary stable creator ids from authenticated viewer item responses.'
        - 'Production deploy guardrails: prevent production GitHub Environment secrets from running against top-level development Wrangler config.'
        - 'Deploy workflow CORS negative proof: expose and forward disallowed-origin smoke input.'
        - 'Local deployment secret hygiene: ignore `.deploy.secrets` and verify cleanup remains present.'
        - 'Runtime/package/setup trust: make supported Node/npm/Wrangler and widget-only package posture explicit without publishing or bumping.'
      deferred_boards:
        - 'Board 5: self-host doctor/setup diagnosis, including Cloudflare/Wrangler/D1/token endpoint preflight and self-host template diagnosis.'
        - 'Board 6: host token signer helpers/templates and local verifier, without moving auth ownership away from the host app.'
        - 'Board 7: sorting/prioritization, accessibility proof, and limited host JS integration API if accepted as product polish.'
        - 'Later security/ops board: GitHub token blast-radius reduction, abuse tier 2, token replay/circuit breaker posture, monitoring, and backup/export/restore runbooks.'
      explicit_user_override_required:
        - 'Status/admin workflow.'
        - 'Admin portal.'
        - 'Issue workflow automation.'
        - 'Any hosted control plane, billing, realtime, comments, downvotes, GitHub Projects, production credential change, Cloudflare deploy, npm publish, or package version bump.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-closed-beta-guardrails/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-closed-beta-guardrails'

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    objective: 'Validate the critique synthesis and choose the first safe Worker package for closed-beta guardrails.'
    expected_output: 'A decision receipt confirming which critique findings are blockers, which are safe Board 4 fixes, which are deferred boards, and which require explicit user override.'
    verify:
      - 'git status --short --branch'
      - 'direct inspection of `src/routes/api.ts`, `src/lib/board-repository.ts`, `.github/workflows/deploy.yml`, `.gitignore`, `package.json`, `README.md`, and closed-beta docs'
      - 'confirm no first Worker requires npm publish, Cloudflare deploy, credential changes, hosted control plane, billing, realtime, comments, downvotes, GitHub Projects, status/admin workflow, or unrelated product behavior'
    stop_if:
      - 'The Judge decides the privacy/deploy/setup-trust fixes cannot be done safely without excluded production operations or product decisions.'
    receipt:
      result: done
      decision: rejected
      summary: 'Initial Board 4 scope was directionally right but not yet safe for Worker execution because Worker tasks lacked stop_if, critique disposition was incomplete, and T002 implementation was already dirty before a receipt.'
      evidence:
        - '`git status --short --branch` showed branch `codex/closed-beta-gap-conveyor` with modified `src/routes/api.ts` and `test/routes.test.ts`, plus the untracked guardrails goal directory.'
        - '`src/routes/api.ts` already contained `publicBoardItem`; `test/routes.test.ts` already asserted creator id absence.'
        - 'Worker tasks lacked stop_if fields in the first draft.'
      note: 'docs/goals/bugdrop-board-closed-beta-guardrails/notes/T001-judge.md'

  - id: T006
    type: judge
    assignee: Judge
    status: done
    objective: 'Re-validate the repaired Board 4 handoff after adding stop_if clauses, critique disposition, and a T002 dirty-change receipt requirement.'
    expected_output: 'A proceed/reject receipt confirming whether Board 4 is now safe to continue from the already-dirty T002 privacy slice.'
    verify:
      - 'git status --short --branch'
      - 'state.yaml has exactly one active task and T002-T004 include stop_if fields'
      - 'state.yaml classifies Board 4 fixes, deferred boards, and explicit user overrides'
      - 'T002 acceptance requires inspecting and receipting already-dirty privacy changes before further writes'
    stop_if:
      - 'The repaired board still leaves Workers without clear stop conditions or asks for excluded product/production work.'
    receipt:
      result: done
      decision: rejected
      summary: 'Second Judge confirmed stop_if and critique disposition repairs, but rejected continuation because T003/T004-scope files were already dirty without matching dirty-change ownership requirements.'
      evidence:
        - 'T002, T003, and T004 had stop_if clauses.'
        - 'critique_disposition classified Board 4 fixes, deferred boards, and explicit override work.'
        - '`git status --short --branch` showed dirty deploy/setup files in addition to T002 privacy files.'
      note: 'docs/goals/bugdrop-board-closed-beta-guardrails/notes/T006-judge.md'

  - id: T007
    type: judge
    assignee: Judge
    status: done
    objective: 'Re-validate Board 4 after T002, T003, and T004 all explicitly own already-dirty changes from this session.'
    expected_output: 'A proceed/reject receipt confirming whether the board can continue by verifying and receipting the dirty T002-T004 slices.'
    verify:
      - 'git status --short --branch'
      - 'state.yaml has exactly one active task and T002-T004 each include dirty-change ownership acceptance plus stop_if'
      - 'state.yaml classifies Board 4 fixes, deferred boards, and explicit user overrides'
      - 'No queued Worker asks for npm publish/version bump, Cloudflare deploy, credential/secret changes, hosted control plane, billing, realtime, comments, downvotes, GitHub Projects, status/admin workflow, or unrelated product behavior'
    stop_if:
