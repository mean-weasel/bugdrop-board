version: 2

goal:
  title: 'BugDrop Board First Production Promotion'
  slug: 'bugdrop-board-first-production-promotion'
  kind: existing_plan
  tranche: 'Conveyor Board 13: first production promotion, approval-gated.'
  status: done
  oracle:
    signal: 'The first production promotion gate preserved explicit approval requirements, and later hosted cutover receipts prove the approved production deploy, smoke, and dogfood path superseded the original blocked deploy task.'
    cadence: 'after readiness import, after runbook preparation, at approval gate, and at final conveyor cleanup'
    final_proof: 'docs/release-readiness-results/2026-06-09-final-conveyor-wrap-audit.md records the superseding approved deploy, hosted cutover, and final wrap decision.'
  intake:
    original_request: 'Create these boards and run them autonomously if you can.'
    interpreted_outcome: 'Prepare the first production promotion board while blocking actual production mutation until explicit approval.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainer approving first production deploy'
    authority: needs_approval_for_production_mutation
    proof_type: decision
    completion_proof: 'Committed runbook and GoalBuddy blocked deploy task show the board is ready for approval.'
    likely_misfire: 'Autonomously deploying production under a broad “run boards” instruction.'
    blind_spots_considered:
      - 'Production origin, board repo, and secret values may still be undecided.'
      - 'Rollback must be known before first deploy.'
      - 'Smoke proof should include Worker health, board.js, signed host, GitHub issue mirror, and upvote polling.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_production_mutation_without_explicit_approval: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-first-production-promotion/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-first-production-promotion'

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: 'Import Board 12 readiness facts and identify any missing approval inputs.'
    acceptance_criteria:
      - 'Production deploy prerequisites are listed.'
      - 'Missing approval inputs are explicit.'
      - 'No production mutation occurs.'
    receipt:
      result: done
      summary: 'Imported Board 12 readiness facts; production promotion prerequisites are not satisfied yet.'
      evidence:
        - 'GitHub Environment `production` now exists.'
        - 'Production D1 database `bugdrop-board-production` now exists and migrations are applied.'
        - 'Production Worker `bugdrop-board` does not exist.'
        - 'Production secrets are partially configured: `CLOUDFLARE_ACCOUNT_ID` and generated `BOARD_TOKEN_SECRET` exist by name.'
        - 'Production secrets still missing: `CLOUDFLARE_API_TOKEN` and `ISSUE_ACCESS_TOKEN`.'
        - 'Production dogfood mirror repo `mean-weasel/bugdrop-board-production-dogfood` exists.'
        - 'Production origin is `https://board.bugdrop.dev` and issuer is `bugdrop-board-production-host`.'

  - id: T002
    type: worker
    assignee: Worker
    status: done
    objective: 'Create the first production promotion runbook receipt.'
    acceptance_criteria:
      - 'Runbook includes exact workflow inputs, smoke checks, rollback, and stop conditions.'
      - 'Actual deploy task remains blocked pending explicit approval.'
    receipt:
      result: done
      summary: 'Prepared the first production promotion runbook and kept the deploy task blocked pending explicit approval.'
      evidence:
        - 'Receipt created at `docs/release-readiness-results/2026-06-04-first-production-promotion.md`.'
        - 'Runbook includes intended workflow inputs, smoke checks, rollback, stop conditions, and approval gate.'
        - 'Actual deploy task remains blocked.'

  - id: T003
    type: worker
    assignee: Worker
    status: done
    objective: 'Execute first production promotion.'
    acceptance_criteria:
      - 'Requires explicit maintainer approval after Board 12 readiness is satisfied.'
      - 'Runs Deploy Worker against production only after approval.'
      - 'Runs production smoke and rollback proof after deploy.'
    receipt:
      result: superseded_by_later_approved_deploy
      summary: 'The original approval gate was valid when written. It is now superseded by later maintainer-approved production deployment, hosted dogfood cutover, GitHub App key compatibility fix, and final wrap-audit proof.'
      evidence:
        - 'Deploy Worker run 27177724385 completed successfully on main after explicit maintainer approval and production secret setup.'
        - 'PR #73 added hosted GitHub App deploy secret support and merged as 7c355e2.'
        - 'PR #74 fixed PKCS#1 GitHub App private-key import and merged as 83beea3.'
        - 'PR #75 recorded hosted dogfood cutover and merged as d332ad9.'
        - 'docs/production-dogfood-results/2026-06-08-hosted-cutover.md records successful production hosted read, CORS negative proof, item create, GitHub Issue mirror, upvote, and browser dogfood proof.'

  - id: T004
    type: audit
    assignee: PM
    status: done
    objective: 'Reconcile this historical approval gate during final conveyor cleanup.'
    acceptance_criteria:
      - 'Historical blocked state is not left as the current top-level board status.'
      - 'Superseding deploy and dogfood evidence is named without exposing secrets.'
      - 'Remaining hosted beta work is classified as next-phase, not a stale blocker for this promotion board.'
    receipt:
      result: done
      summary: 'Final conveyor cleanup reconciled the historical approval-gated board with later approved production deployment and hosted dogfood evidence.'
      evidence:
        - 'docs/release-readiness-results/2026-06-09-final-conveyor-wrap-audit.md'
