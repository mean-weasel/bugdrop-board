      - 'npm run validate'
      - 'node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.8/skills/goalbuddy/scripts/check-goal-state.mjs docs/goals/bugdrop-board-docs-drift-cleanup/state.yaml'
      - 'README scope scan for stale or forbidden release language'
    stop_if:
      - 'Need runtime/product behavior changes.'
      - 'Need a new npm publish, production deploy, secret rotation, or credential change.'
    receipt:
      result: done
      task_id: T002
      changed_files:
        - 'README.md'
        - 'docs/goals/bugdrop-board-docs-drift-cleanup/goal.md'
        - 'docs/goals/bugdrop-board-docs-drift-cleanup/state.yaml'
      summary: 'Added the post-publish release smoke to the package workflow docs and updated handoff notes to reflect the live npm package and production Worker.'
      commands:
        - command: 'npx prettier --check README.md docs/goals/bugdrop-board-docs-drift-cleanup/goal.md docs/goals/bugdrop-board-docs-drift-cleanup/state.yaml'
          status: pass
          evidence: 'All selected docs files use Prettier style.'
        - command: 'npm run validate'
          status: pass
          evidence: 'eslint, Prettier, TypeScript, and 50 Vitest tests passed.'
        - command: 'README scope scan for stale or forbidden release language'
          status: pass
          evidence: 'Stale handoff strings are absent; matches are expected secret-management docs, release-smoke docs, the existing publish command, and the updated live release status.'

  - id: T999
    type: judge
    assignee: Judge
    status: done
    objective: 'Final audit: decide whether docs drift cleanup satisfies the oracle.'
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      evidence:
        - 'README package workflow command block includes npm run release:smoke after npm publish.'
        - 'Current Handoff Notes identify @mean-weasel/bugdrop-board@0.1.0 and https://board.bugdrop.dev as live.'
        - 'No runtime product behavior, new npm publish, production deploy, secret rotation, hosted control plane, billing, realtime, comments, downvotes, or GitHub Projects change was introduced.'

