version: 2

goal:
  title: 'BugDrop Board Docs Drift Cleanup'
  slug: 'bugdrop-board-docs-drift-cleanup'
  kind: existing_plan
  tranche: 'Post-v0.1.0 docs accuracy cleanup only.'
  status: done
  oracle:
    signal: 'README release and package docs match the current npm/production state.'
    cadence: 'after Worker edit and final audit'
    final_proof: 'README diff inspection, markdown formatting, validate, and forbidden-scope scan.'
  intake:
    original_request: 'Continue the BugDrop Board release-readiness conveyor while the user is away.'
    interpreted_outcome: 'Fix a small, safe docs drift bundle found after v0.1.0 and release-smoke automation.'
    input_shape: existing_plan
    audience: 'BugDrop Board maintainers and self-hosters reading the setup/release docs'
    authority: approved_for_safe_local_and_pr_work
    proof_type: artifact
    completion_proof: 'README is current and verification gates pass without publishing or production changes.'
    likely_misfire: 'Changing product behavior or doing operational release work while trying to fix docs drift.'
    blind_spots_considered:
      - 'README handoff still described npm identity and production deploy as future work after they were completed.'
      - 'Package workflow docs did not mention the new release smoke step.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: 'http://goalbuddy.localhost:41737/bugdrop-board-docs-drift-cleanup/'
    command: 'npx goalbuddy board docs/goals/bugdrop-board-docs-drift-cleanup'

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: 'Identify the smallest safe docs drift cleanup after v0.1.0 release and release-smoke automation.'
    receipt:
      result: done
      summary: 'Scout found two README drift issues: package workflow docs missing release:smoke and stale handoff notes saying package identity/production deploy were still future actions.'
      evidence:
        - 'README package workflow command list ended at npm publish and omitted npm run release:smoke.'
        - 'Current Handoff Notes still said to choose the npm package/version identity and avoid production deploy/npm publish.'

  - id: T002
    type: worker
    assignee: Worker
    status: done
    objective: 'Apply the README docs drift cleanup.'
