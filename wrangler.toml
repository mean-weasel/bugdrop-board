name = "bugdrop-board"
main = "src/index.ts"
compatibility_date = "2024-01-29"

[assets]
directory = "public"
binding = "ASSETS"

[vars]
ENVIRONMENT = "development"
# Development default only. For deployed Workers, replace with exact host app
# origins such as "https://app.example.com,https://admin.example.com".
ALLOWED_ORIGINS = "*"
BOARD_TOKEN_AUDIENCE = "bugdrop-board"
BOARD_TOKEN_ISSUER = "dummy-host"
REQUEST_THROTTLE_WINDOW_SECONDS = "60"
ITEM_CREATE_RATE_LIMIT = "5"
UPVOTE_RATE_LIMIT = "60"

# Set BOARD_TOKEN_SECRET and GITHUB_ISSUE_ACCESS_TOKEN in .dev.vars locally.
# For deployed environments, use `wrangler secret put`; do not commit secrets.

[[d1_databases]]
binding = "DB"
# For production self-hosting, create a remote D1 database and replace these
# placeholder ids with the ids returned by `wrangler d1 create`.
database_name = "bugdrop-board-dev"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.staging]
name = "bugdrop-board-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "http://127.0.0.1:5177"
BOARD_TOKEN_AUDIENCE = "bugdrop-board"
BOARD_TOKEN_ISSUER = "bugdrop-board-dogfood-host"
REQUEST_THROTTLE_WINDOW_SECONDS = "60"
ITEM_CREATE_RATE_LIMIT = "5"
UPVOTE_RATE_LIMIT = "60"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "bugdrop-board-staging"
database_id = "e4bfc871-ace5-49b9-b795-1e85ce535b9f"
migrations_dir = "migrations"

[env.production]
name = "bugdrop-board"
workers_dev = true

[[env.production.routes]]
pattern = "board.bugdrop.dev"
custom_domain = true

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://bugdrop.dev,https://board.bugdrop.dev"
BOARD_TOKEN_AUDIENCE = "bugdrop-board"
BOARD_TOKEN_ISSUER = "bugdrop-board-production-host"
REQUEST_THROTTLE_WINDOW_SECONDS = "60"
ITEM_CREATE_RATE_LIMIT = "5"
UPVOTE_RATE_LIMIT = "60"

[[env.production.d1_databases]]
binding = "DB"
database_name = "bugdrop-board-production"
database_id = "6f463f05-eb50-4de9-836d-0eed35f7305c"
migrations_dir = "migrations"
