name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing deployment secrets.
        required: true
        type: environment
      wrangler_environment:
        description: Optional Wrangler environment name, for example staging.
        required: false
        type: string
      apply_migrations:
        description: Apply remote D1 migrations before deploying.
        required: true
        default: true
        type: boolean
      provision_repo:
        description: Optional GitHub repo to provision, in owner/name form.
        required: false
        type: string
      provision_name:
        description: Optional display name for the provisioned board.
        required: false
        type: string
      smoke_url:
        description: Optional deployed Worker URL to verify after deployment.
        required: false
        type: string
      smoke_expect_environment:
        description: Optional expected /health environment value. Defaults to the GitHub Environment name.
        required: false
        type: string
      smoke_cors_origin:
        description: Optional browser origin expected in deployed Worker CORS responses.
        required: false
        type: string
      smoke_cors_disallowed_origin:
        description: Optional browser origin expected not to receive deployed Worker CORS access.
        required: false
        type: string
      smoke_cors_board_id:
        description: Optional board id used for authenticated CORS /items and /events smoke checks.
        required: false
        type: string
      smoke_cors_token_endpoint:
        description: Optional endpoint returning a short-lived board token for CORS smoke checks.
        required: false
        type: string

jobs:
  deploy:
    name: Promote Worker
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOARD_TOKEN_SECRET: ${{ secrets.BOARD_TOKEN_SECRET }}
      GITHUB_ISSUE_ACCESS_TOKEN: ${{ secrets.ISSUE_ACCESS_TOKEN }}
      PROVISION_REPO: ${{ inputs.provision_repo }}
      PROVISION_NAME: ${{ inputs.provision_name }}
      GITHUB_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      SMOKE_EXPECT_ENVIRONMENT: ${{ inputs.smoke_expect_environment || inputs.environment }}
      SMOKE_CORS_BOARD_ID: ${{ inputs.smoke_cors_board_id }}
      SMOKE_CORS_DISALLOWED_ORIGIN: ${{ inputs.smoke_cors_disallowed_origin }}
      SMOKE_CORS_ORIGIN: ${{ inputs.smoke_cors_origin }}
      SMOKE_CORS_TOKEN_ENDPOINT: ${{ inputs.smoke_cors_token_endpoint }}
      SMOKE_URL: ${{ inputs.smoke_url }}
      WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Validate required secrets
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BOARD_TOKEN_SECRET GITHUB_ISSUE_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              secret_name="$name"
              if [ "$name" = "GITHUB_ISSUE_ACCESS_TOKEN" ]; then
                secret_name="ISSUE_ACCESS_TOKEN"
              fi
              echo "::error::Missing required GitHub Environment secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Validate Wrangler environment
        run: |
          resolved_environment="$WRANGLER_ENVIRONMENT"
          if [ -z "$resolved_environment" ]; then
            resolved_environment="$GITHUB_DEPLOY_ENVIRONMENT"
            echo "WRANGLER_ENVIRONMENT=$resolved_environment" >> "$GITHUB_ENV"
          fi

          if [[ ! "$resolved_environment" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::Wrangler environment must contain only letters, numbers, underscores, and hyphens"
            exit 1
          fi

          if [ "$GITHUB_DEPLOY_ENVIRONMENT" = "production" ] && [ "$resolved_environment" != "production" ]; then
            echo "::error::Production deploys must use wrangler_environment=production or leave it blank to default to production"
            exit 1
          fi

          if [ "$GITHUB_DEPLOY_ENVIRONMENT" = "production" ] && [ -z "$SMOKE_URL" ]; then
            echo "::error::Production deploys require smoke_url so the deployed Worker is verified"
            exit 1
          fi

      - name: Run validation gates
        run: npm run validate

      - name: Build widget
        run: npm run build:widget

      - name: Dry-run deploy package
        run: |
          npm run build:widget
          args=(deploy --dry-run)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          npx wrangler "${args[@]}"

      - name: Apply remote D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: |
          args=(d1 migrations apply DB --remote)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          npx wrangler "${args[@]}"

      - name: Provision board
        if: ${{ inputs.provision_repo != '' }}
        run: |
          args=(--repo "$PROVISION_REPO" --remote)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          if [ -n "$PROVISION_NAME" ]; then
            args+=(--name "$PROVISION_NAME")
          fi
          npm run provision:board -- "${args[@]}"

      - name: Write deployment secrets file
        run: |
          umask 077
          {
            printf 'BOARD_TOKEN_SECRET=%s\n' "$BOARD_TOKEN_SECRET"
            printf 'GITHUB_ISSUE_ACCESS_TOKEN=%s\n' "$GITHUB_ISSUE_ACCESS_TOKEN"
          } > .deploy.secrets

      - name: Deploy Worker
        run: |
          args=(deploy --secrets-file .deploy.secrets)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          npx wrangler "${args[@]}"

      - name: Verify deployed Worker
        if: ${{ inputs.smoke_url != '' }}
        run: |
          args=(--url "$SMOKE_URL" --expect-environment "$SMOKE_EXPECT_ENVIRONMENT")
          if [ -n "$SMOKE_CORS_ORIGIN" ] || [ -n "$SMOKE_CORS_DISALLOWED_ORIGIN" ] || [ -n "$SMOKE_CORS_BOARD_ID" ] || [ -n "$SMOKE_CORS_TOKEN_ENDPOINT" ]; then
            args+=(--cors-origin "$SMOKE_CORS_ORIGIN")
            args+=(--cors-disallowed-origin "$SMOKE_CORS_DISALLOWED_ORIGIN")
            args+=(--cors-board-id "$SMOKE_CORS_BOARD_ID")
            args+=(--cors-token-endpoint "$SMOKE_CORS_TOKEN_ENDPOINT")
          fi
          npm run deploy:smoke -- "${args[@]}"

      - name: Remove deployment secrets file
        if: always()
        run: rm -f .deploy.secrets
