name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing deployment secrets.
        required: true
        type: environment
      wrangler_environment:
        description: Optional Wrangler environment name, for example staging.
        required: false
        type: string
      apply_migrations:
        description: Apply remote D1 migrations before deploying.
        required: true
        default: true
        type: boolean
      provision_repo:
        description: Optional GitHub repo to provision, in owner/name form.
        required: false
        type: string
      provision_name:
        description: Optional display name for the provisioned board.
        required: false
        type: string

jobs:
  deploy:
    name: Promote Worker
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOARD_TOKEN_SECRET: ${{ secrets.BOARD_TOKEN_SECRET }}
      GITHUB_ISSUE_ACCESS_TOKEN: ${{ secrets.GITHUB_ISSUE_ACCESS_TOKEN }}
      PROVISION_REPO: ${{ inputs.provision_repo }}
      PROVISION_NAME: ${{ inputs.provision_name }}
      WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Validate required secrets
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BOARD_TOKEN_SECRET GITHUB_ISSUE_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Environment secret: ${name}"
              exit 1
            fi
          done

      - name: Validate Wrangler environment
        run: |
          if [ -n "$WRANGLER_ENVIRONMENT" ] && ! printf '%s' "$WRANGLER_ENVIRONMENT" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_-]*$'; then
            echo "::error::Wrangler environment must contain only letters, numbers, underscores, and hyphens"
            exit 1
          fi

      - name: Run validation gates
        run: npm run validate

      - name: Build widget
        run: npm run build:widget

      - name: Dry-run deploy package
        run: npm run deploy:check

      - name: Apply remote D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: |
          args=(d1 migrations apply DB --remote)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          npx wrangler "${args[@]}"

      - name: Provision board
        if: ${{ inputs.provision_repo != '' }}
        run: |
          args=(--repo "$PROVISION_REPO" --remote)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          if [ -n "$PROVISION_NAME" ]; then
            args+=(--name "$PROVISION_NAME")
          fi
          npm run provision:board -- "${args[@]}"

      - name: Write deployment secrets file
        run: |
          umask 077
          {
            printf 'BOARD_TOKEN_SECRET=%s\n' "$BOARD_TOKEN_SECRET"
            printf 'GITHUB_ISSUE_ACCESS_TOKEN=%s\n' "$GITHUB_ISSUE_ACCESS_TOKEN"
          } > .deploy.secrets

      - name: Deploy Worker
        run: |
          args=(deploy --secrets-file .deploy.secrets)
          if [ -n "$WRANGLER_ENVIRONMENT" ]; then
            args+=(--env "$WRANGLER_ENVIRONMENT")
          fi
          npx wrangler "${args[@]}"

      - name: Remove deployment secrets file
        if: always()
        run: rm -f .deploy.secrets
