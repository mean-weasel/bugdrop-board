name: Dogfood Demo Data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing deployment secrets.
        required: true
        type: environment
      wrangler_environment:
        description: Wrangler environment containing the dogfood D1 database.
        required: true
        default: production
        type: string

jobs:
  seed-kanban-statuses:
    name: Seed kanban statuses
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_ENVIRONMENT: ${{ inputs.wrangler_environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate target
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Environment secret: ${name}"
              exit 1
            fi
          done

          if [ "$WRANGLER_ENVIRONMENT" != "production" ]; then
            echo "::error::Dogfood demo data seeding is currently limited to production"
            exit 1
          fi

      - name: Install dependencies
        run: make install

      - name: Seed dogfood kanban statuses
        run: npm run dogfood:seed-kanban -- --env "$WRANGLER_ENVIRONMENT"
