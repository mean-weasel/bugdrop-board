name: Package Widget

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the npm package without publishing.
        required: true
        default: true
        type: boolean
      npm_tag:
        description: npm dist-tag to use when publishing.
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

jobs:
  package:
    name: Package Embed Script
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TAG: ${{ inputs.npm_tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: make install

      - name: Run validation gates
        run: npm run validate

      - name: Dry-run package contents
        run: npm run pack:check

      - name: Validate npm token
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing required repository secret: NPM_TOKEN"
            exit 1
          fi

      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Verify published package
        if: ${{ !inputs.dry_run }}
        run: npm run release:smoke
